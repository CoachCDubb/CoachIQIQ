<script>

function loadPage(page) {

  google.script.run
    .withSuccessHandler(function(html) {

      document.getElementById("page-content").innerHTML = html;

      // Update active navigation
      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");

        if (item.dataset.page === page) {
          item.classList.add("active");
        }
      });

      // Auto-load page data
     switch(page){

case "Dashboard":
    loadDashboard();
    break;

  case "Players":
    loadPlayers();
    break;

  case "Settings":
    loadSettings();
    break;

case "Evaluations":

    if (!window.viewMode) {
        loadEvaluations();
    }

    break;

    case "Sessions":
    loadSessions();
    break;

    case "Leaderboard":
    loadLeaderboard();
    break;

    case "PlayerProfile":
    loadPlayerProfile();
    break;
}

    })
    .getPage(page);

}

function loadPlayers(){

  google.script.run
    .withSuccessHandler(showPlayers)
    .getPlayersForUI();

}

const CoachIQ = {

  settings: {},

  players: []

};

function showPlayers(players){

  CoachIQ.players = players;

  loadDropdownSettings(function(settings){

    CoachIQ.settings = settings;

    populateTeamFilter(settings.teams);

    renderPlayers(players);

  });

}
function populateTeamFilter(teams){

  const teamFilter = document.getElementById("teamFilter");

  teamFilter.innerHTML = "";

  teamFilter.innerHTML += `
    <option value="All">All Teams</option>
  `;

  teams.forEach(team => {

    teamFilter.innerHTML += `
      <option value="${team}">${team}</option>
    `;

  });

}
function buildOptions(options, selectedValue = ""){

  let html = "";

  options.forEach(function(option){

    html += `
      <option value="${option}"
        ${option === selectedValue ? "selected" : ""}>
        ${option}
      </option>
    `;

  });

  return html;

}

function savePlayerChanges(playerId){

  const updatedPlayer = {

    id: playerId,
    firstName: document.getElementById("editFirstName").value,
    lastName: document.getElementById("editLastName").value,
    jersey: document.getElementById("editJersey").value,
    grade: document.getElementById("editGrade").value,
    team: document.getElementById("editTeam").value,
    position: document.getElementById("editPosition").value,
    status: document.getElementById("editStatus").value

  };

  google.script.run

function addPlayer(playerId){

  const newPlayer = {

    id: playerId,
    firstName: document.getElementById("addFirstName").value,
    lastName: document.getElementById("addLastName").value,
    jersey: document.getElementById("addJersey").value,
    grade: document.getElementById("addGrade").value,
    team: document.getElementById("addTeam").value,

  };

    .withSuccessHandler(function(){

}
function archivePlayer(playerId){

    const player = CoachIQ.players.find(p => p[0] === playerId);

    const confirmArchive = confirm(
        `Archive ${player[1]} ${player[2]}?\n\nThis player will be removed from the active roster but all history will be preserved.`
    );

    if (!confirmArchive){
        return;
    }

    google.script.run
        .withSuccessHandler(function(){

            loadPlayers();

        })
        .archivePlayer(playerId);

}
function loadDropdownSettings(callback){

  google.script.run
    .withSuccessHandler(function(settings){

      CoachIQ.settings = settings;

      callback(settings);

    })
    .getDropdownSettings();

}
function loadSettings(){

  google.script.run
    .withSuccessHandler(showSettings)
    .getCoachIQSettings();

}

function showSettings(settings){

  document.getElementById("programName").value =
    settings.programName;

  document.getElementById("schoolName").value =
    settings.schoolName;

  document.getElementById("currentSeason").value =
    settings.currentSeason;

  renderSettingsList("teamsContainer", settings.teams);

  renderSettingsList("positionsContainer", settings.positions);

  renderSettingsList("statusesContainer", settings.statuses);

  renderSettingsList("cultureContainer", settings.cultureCategories);

  renderSettingsList("staffContainer", settings.staff);

  renderRewards(settings.rewards);

}
function saveProgramInformation(){

  const data = {

    programName: document.getElementById("programName").value,

    schoolName: document.getElementById("schoolName").value,

    })

function saveSettingsList(containerId, settingName){

  const items = [];

  document
    .querySelectorAll(`#${containerId} .setting-input`)
    .forEach(function(input){

      if(input.value.trim() !== ""){

        items.push(input.value.trim());

      }

    });

  google.script.run
    .withSuccessHandler(function(){

      showToast(settingName + " Saved!");

      loadSettings();

    })
    .saveSettingList(settingName, items);

}
function showToast(message){

  const toast = document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  }, 2000);

}

    teamContainer.innerHTML += `

function showSessionSummary(session, status){

    document.getElementById("sessionSetupCard").style.display = "none";
    document.getElementById("sessionSummaryCard").style.display = "block";

    document.getElementById("summarySessionType").innerText =
        session.sessionType || "Practice";

    const displayDate = new Date(session.date);

if (!isNaN(displayDate.getTime())) {

    document.getElementById("summaryDate").innerText =
        "📅 " + displayDate.toLocaleDateString();

} else {

    document.getElementById("summaryDate").innerText =
        "📅 " + session.date;

}

if(session.created){

    const time = new Date(session.created);

    document.getElementById("summaryTime").innerText =
        "🕒 " + time.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        });

}else{

    document.getElementById("summaryTime").innerText = "";

}
    document.getElementById("summaryTeams").innerText =
        "👥 " + session.teams.join(", ");

    document.getElementById("summaryEvaluator").innerText =
        "👤 " + session.evaluators.join(", ");

    document.getElementById("summaryStatus").innerText =
        status;

    document.getElementById("summaryStatus").className =
        status === "Completed"
            ? "status-pill status-completed"
            : "status-pill status-progress";

    if(session.sessionNotes){

        document.getElementById("summaryNotes").style.display = "block";
        document.getElementById("summaryNotesText").innerText =
            session.sessionNotes;

    }else{

        document.getElementById("summaryNotes").style.display = "none";

    }

}

function initializeRatingButtons(){

    document.querySelectorAll(".rating-group").forEach(function(group){

        group.querySelectorAll(".rating-btn").forEach(function(button){

            button.addEventListener("click", function(){

                // Update button color
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                // Read button data
                const sessionId = button.dataset.session;
                const playerId = button.dataset.player;
                const category = button.dataset.category;
                const score = Number(button.dataset.score);

                // Save to Google Sheets
                google.script.run
                    .withFailureHandler(function(error){
                        alert(error.message);
                    })
                    .updateEvaluationScore(
                        sessionId,
                        playerId,
                        category,
                        score
                    );

            });

        });

    });

}
function initializeAttendanceCheckboxes(){

    document
        .querySelectorAll(".attendance-check")
        .forEach(function(box){

            box.addEventListener("change", function(){

                const row = box.closest(".evaluation-row");

                const sessionId = window.currentPracticeSession;

                const playerId = row.dataset.player;

                const buttons = row.querySelectorAll(".rating-btn");

                if(box.checked){

                    row.classList.remove("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = false;
                    });

                }else{

                    row.classList.add("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = true;
                    });

                }

                console.log("Saving attendance...");
                console.log({
                    sessionId: sessionId,
                    playerId: playerId,
                    present: box.checked
                });

                google.script.run
                    .withSuccessHandler(function(){
                        console.log("Attendance saved successfully.");
                    })
                    .withFailureHandler(function(error){
                        console.error("Attendance save failed:", error);
                    })
                    .updateAttendance(
                        sessionId,
                        playerId,
                        box.checked
                    );

            });

        });

}

function deleteSession(sessionId){

        `This will permanently delete:<br><br>
        • The session<br>
        • All player evaluations<br><br>
        <strong>This cannot be undone.</strong>`,

        "Delete",

        function(){

            google.script.run
               .withSuccessHandler(function(){

    const card = document.getElementById("session-" + sessionId);

    if(card){

        card.style.transition = "all .25s ease";

        card.style.opacity = "0";

        card.style.transform = "translateX(30px)";

        setTimeout(function(){

            card.remove();

        }, 250);

    }

    showToast("Session deleted.");

})

function restoreEvaluationScores(scores){

  Object.keys(scores).forEach(function(playerId){

    const playerScores = scores[playerId];

    console.log("Player:", playerId);
console.log("Attendance:", playerScores.Attendance);
console.log("Type:", typeof playerScores.Attendance);
console.log(playerScores);

    // -------------------------
    // Restore Attendance
    // -------------------------

    if(playerScores.Attendance === false){

      const row = document.querySelector(
        `.evaluation-row[data-player="${playerId}"]`
      );

      if(row){

        const checkbox = row.querySelector(".attendance-check");

        checkbox.checked = false;

        row.classList.add("player-absent");

        row.querySelectorAll(".rating-btn").forEach(function(btn){
          btn.disabled = true;
        });

      }

    }

    // -------------------------
    // Restore Ratings
    // -------------------------

    Object.keys(playerScores).forEach(function(category){

  if(category === "Attendance"){
    return;
  }

  if(category === "Reward"){

    const dropdown = document.querySelector(
      `.reward-select[data-player="${playerId}"]`
    );

    if(dropdown){
      dropdown.value = playerScores.Reward;
    }

    return;

  }

  const score = playerScores[category];

      if(score === "" || score == null){
        return;
      }

      const button = document.querySelector(
        `.rating-btn[data-player="${playerId}"][data-category="${category}"][data-score="${score}"]`
      );

      if(button){

        button.classList.add("selected");

      }

    });

  });

}

function savePointRewards(){

  const rewards = [];

  document.querySelectorAll(".reward-row").forEach(function(row,index){

    const name = row.querySelector(".reward-name").value.trim();

    const points = Number(
      row.querySelector(".reward-points").value
    );

    const active =
      row.querySelector(".reward-active").checked;

    if(name === ""){
      return;
    }

    rewards.push({

      id: "R" + String(index + 1).padStart(3,"0"),

      name: name,

      points: points,

      active: active,

      order: index + 1

    });

  });

  google.script.run
    .withSuccessHandler(function(){

      showToast("Point Rewards Saved!");

      loadSettings();

    })
    .savePointRewards(rewards);

}
