<script>

const PageNavigation = {
    currentPage: null,
    requestId: 0,
    loadingPage: null,
    evaluationMode: "new",
    evaluationSessionId: null
};

const EvaluationSaves = {
    pending: 0,
    failed: false
};

function updateEvaluationSaveStatus(){
    const status = document.getElementById("evaluationSaveStatus");
    const finishButton = document.getElementById("finishSessionButton");

    if(status){
        status.style.display = "block";
        status.style.color = EvaluationSaves.failed ? "#b42318" : "#666";
        status.textContent = EvaluationSaves.failed
            ? "A change failed to save. Retry it before finishing."
            : EvaluationSaves.pending > 0
                ? "Saving " + EvaluationSaves.pending + " change(s)…"
                : "All changes saved.";
    }

    if(finishButton){
        finishButton.disabled = EvaluationSaves.pending > 0 || EvaluationSaves.failed;
    }
}

function beginEvaluationSave(){
    EvaluationSaves.pending++;
    updateEvaluationSaveStatus();
}

function endEvaluationSave(succeeded){
    EvaluationSaves.pending = Math.max(0, EvaluationSaves.pending - 1);
    EvaluationSaves.failed = EvaluationSaves.failed || !succeeded;
    updateEvaluationSaveStatus();
}

function retryEvaluationSave(){
    EvaluationSaves.failed = false;
    beginEvaluationSave();
}

function resetEvaluationSaveState(){
    EvaluationSaves.pending = 0;
    EvaluationSaves.failed = false;
    updateEvaluationSaveStatus();
}

function isCurrentPage(page, requestId){
    return PageNavigation.currentPage === page &&
        (requestId == null || PageNavigation.requestId === requestId);
}

function loadPage(page, callback){

    if(PageNavigation.loadingPage === page){
        return;
    }

    const requestId = ++PageNavigation.requestId;
    PageNavigation.loadingPage = page;

    google.script.run
    .withSuccessHandler(function(html){

        if(requestId !== PageNavigation.requestId){
            return;
        }

        const container = document.getElementById("page-content");

        if(!container){
            console.error("page-content not found.");
            return;
        }

        container.innerHTML = html;
        PageNavigation.currentPage = page;
        PageNavigation.loadingPage = null;

        // Update Navigation
        document.querySelectorAll(".nav-item").forEach(function(item){

            item.classList.remove("active");

            if(item.dataset.page === page){
                item.classList.add("active");
            }

        });

        // Wait until browser finishes rendering
        requestAnimationFrame(function(){

            if(!isCurrentPage(page, requestId)){
                return;
            }

            switch(page){

                case "Dashboard":
                    loadDashboard(requestId);
                    break;

                case "Players":
                    loadPlayers(requestId);
                    break;

                case "Sessions":
                    loadSessions(requestId);
                    break;

                case "Evaluations":
                    initializeEvaluationsPage(requestId);
                    break;

                case "Leaderboard":
                    loadLeaderboard(requestId);
                    break;

                case "Settings":
                    loadSettings(requestId);
                    break;

                case "PlayerProfile":
                    loadPlayerProfile();
                    break;

            }

            if(typeof callback === "function"){
                callback();
            }

        });

    })
    .withFailureHandler(function(error){

        if(requestId !== PageNavigation.requestId){
            return;
        }

        PageNavigation.loadingPage = null;

        console.error(error);

        showToast(
            "Unable to load page.",
            "error"
        );

    })
    .getPage(page);

}

function loadPlayers(requestId){

  google.script.run
    .withSuccessHandler(function(players){
      if(isCurrentPage("Players", requestId)){
        showPlayers(players, requestId);
      }
    })
    .getPlayersForUI();

}

};

function showPlayers(players, requestId){

  CoachIQ.players = players;

  loadDropdownSettings(function(settings){

    if(!isCurrentPage("Players", requestId)){
      return;
    }

    CoachIQ.settings = settings;

    populateTeamFilter(settings.teams);

    renderPlayers(players);

  });

}
function populateTeamFilter(teams){

  const teamFilter = document.getElementById("teamFilter");

  teamFilter.innerHTML = "";

  teamFilter.innerHTML += `
    <option value="All">All Teams</option>
  `;

  teams.forEach(team => {

    teamFilter.innerHTML += `
      <option value="${team}">${team}</option>
    `;

  });

}
function buildOptions(options, selectedValue = ""){

  let html = "";

  options.forEach(function(option){

    html += `
      <option value="${option}"
        ${option === selectedValue ? "selected" : ""}>
        ${option}
      </option>
    `;

  });

  return html;

}

    }

        })
        .archivePlayer(playerId);

}

    .saveSettingList(settingName, items);

}
function showToast(message){

  }, 2000);

}

function startSession(){

  const requestId = PageNavigation.requestId;

  const selectedTeams = [];

  document
    .querySelectorAll(".evaluationTeam:checked")
    .forEach(function(box){

      selectedTeams.push(box.value);

    });

  if(selectedTeams.length === 0){

    alert("Please select at least one team.");

    return;

  }

  // Get evaluator(s)
  const evaluators = [
    document.getElementById("evaluatorSelect").value
  ];

  if(!evaluators[0] || evaluators[0] === "Loading..."){
    showToast("Please select an evaluator.");
    return;
  }

  if(!document.getElementById("practiceDate").value){
    showToast("Please select a session date.");
    return;
  }

  const startButton = document.getElementById("startSessionButton");

  if(startButton && startButton.disabled){
    return;
  }

  if(startButton){
    startButton.disabled = true;
    startButton.textContent = "Starting…";
  }

  // Build Practice Session
const session = {

    sessionType: document.getElementById("sessionType").value,

    date: document.getElementById("practiceDate").value,

    phase: "",

    teams: selectedTeams,

    evaluators: evaluators,

    sessionNotes: document.getElementById("practiceNotes").value

};

      window.currentPracticeSession = sessionId;
      const evaluator = session.evaluators[0];

    document.getElementById("sessionSummaryCard").style.display = "block";

    document.getElementById("summarySessionType").innerText =
        session.sessionType;

    document.getElementById("summaryDate").innerText =
        "📅 " + session.date;

    document.getElementById("summaryTeams").innerText =
        "👥 " + session.teams.join(", ");

    document.getElementById("summaryEvaluator").innerText =
        "👤 " + evaluator;

    document.getElementById("summaryStatus").innerText =
        "In Progress";

    document.getElementById("summaryStatus").className =
        "status-pill status-progress";

    if(session.sessionNotes){

        document.getElementById("summaryNotes").style.display = "block";

        document.getElementById("summaryNotesText").innerText =
            session.sessionNotes;

    }else{

        document.getElementById("summaryNotes").style.display = "none";

function initializeRatingButtons(){

    document.querySelectorAll(".rating-group").forEach(function(group){

        group.querySelectorAll(".rating-btn").forEach(function(button){

            button.addEventListener("click", function(){

                if(group.dataset.saving === "true"){
                    return;
                }

                const previousButton = group.querySelector(".rating-btn.selected");

                // Update button color
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                // Read button data
                const sessionId = button.dataset.session;
                const playerId = button.dataset.player;
                const category = button.dataset.category;
                const score = Number(button.dataset.score);

                group.dataset.saving = "true";
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.disabled = true;
                });
                retryEvaluationSave();

                // Save to Google Sheets
                google.script.run
                    .withSuccessHandler(function(){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                        });
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                            btn.classList.remove("selected");
                        });
                        if(previousButton){
                            previousButton.classList.add("selected");
                        }
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save score.");
                    })
                    .updateEvaluationScore(
                        sessionId,
                        playerId,
                        category,
                        score
                    );

            });

        });

    });

function initializeAttendanceCheckboxes(){

    document
        .querySelectorAll(".attendance-check")
        .forEach(function(box){

            box.addEventListener("change", function(){

                const row = box.closest(".evaluation-row");

                const sessionId = window.currentPracticeSession;

                const playerId = row.dataset.player;

                const buttons = row.querySelectorAll(".rating-btn");
                const newValue = box.checked;

                box.disabled = true;
                retryEvaluationSave();

                if(box.checked){

                    row.classList.remove("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = false;
                    });

                }else{

                    row.classList.add("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = true;
                    });

                }

                google.script.run
                    .withSuccessHandler(function(){
                        box.disabled = false;
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        box.checked = !newValue;
                        box.disabled = false;
                        row.classList.toggle("player-absent", !box.checked);
                        buttons.forEach(function(btn){
                            btn.disabled = !box.checked;
                        });
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save attendance.");
                    })
                    .updateAttendance(
                        sessionId,
                        playerId,
                        newValue

function restoreEvaluationScores(scores){

  Object.keys(scores).forEach(function(playerId){

    const playerScores = scores[playerId];

    console.log("Player:", playerId);
console.log("Attendance:", playerScores.Attendance);
console.log("Type:", typeof playerScores.Attendance);
console.log(playerScores);

    // -------------------------
    // Restore Attendance
    // -------------------------

    if(playerScores.Attendance === false){

      const row = document.querySelector(
        `.evaluation-row[data-player="${playerId}"]`
      );

      if(row){

        const checkbox = row.querySelector(".attendance-check");

        checkbox.checked = false;

        row.classList.add("player-absent");

        row.querySelectorAll(".rating-btn").forEach(function(btn){
          btn.disabled = true;
        });

      }

    }

    // -------------------------
    // Restore Ratings
    // -------------------------

    Object.keys(playerScores).forEach(function(category){

  if(category === "Attendance"){
    return;
  }

  if(category === "Reward"){

    const dropdown = document.querySelector(
      `.reward-select[data-player="${playerId}"]`
    );

    if(dropdown){
      let rewardId = playerScores.Reward || "";

      if(rewardId && !Array.from(dropdown.options).some(function(option){
        return option.value === rewardId;
      })){
        const legacyReward = (window.pointRewards || []).find(function(reward){
          return reward["Reward Name"] === rewardId;
        });
        rewardId = legacyReward ? legacyReward["Reward ID"] : "";
      }

      dropdown.value = rewardId;
      dropdown.dataset.savedValue = rewardId;
    }

    return;

  }

  if(category === "Notes"){
    const preview = document.querySelector(
      `.evaluation-note-preview[data-player="${playerId}"]`
    );
    if(preview){
      preview.textContent = playerScores.Notes || "";
      preview.title = playerScores.Notes || "";
    }
    return;
  }

  const score = playerScores[category];

      if(score === "" || score == null){
        return;
      }

      const button = document.querySelector(
        `.rating-btn[data-player="${playerId}"][data-category="${category}"][data-score="${score}"]`
      );

      if(button){

        button.classList.add("selected");

      }

    });

  });

}

function populateLeaderboardTeams(players){
  const select = document.getElementById("leaderboardTeam");
  if(!select){ return; }
  const selected = select.value;
  const teams = Array.from(new Set(players.map(function(player){
    return player.team;
  }).filter(Boolean))).sort();
  select.innerHTML = '<option value="">All Teams</option>' +
    teams.map(function(team){
      return '<option value="' + team + '">' + team + '</option>';
    }).join("");
  select.value = selected;
}

function filterLeaderboard(){
  const searchElement = document.getElementById("leaderboardSearch");
  const teamElement = document.getElementById("leaderboardTeam");
  const search = searchElement ? searchElement.value.trim().toLowerCase() : "";
  const team = teamElement ? teamElement.value : "";
  const players = (window.leaderboardPlayers || []).filter(function(player){
    const fullName = (player.firstName + " " + player.lastName).toLowerCase();
    return (!search || fullName.includes(search)) &&
      (!team || player.team === team);
  });
  showLeaderboard(players);
}

    let badgeClass = "default-rank";

function downloadLeaderboardPdf(button){
  const originalText = button.textContent;
  const options = {
    search: document.getElementById("leaderboardSearch").value.trim(),
    team: document.getElementById("leaderboardTeam").value
  };
  button.disabled = true;
  button.textContent = "Building PDF…";
  google.script.run
    .withSuccessHandler(function(report){
      const link = document.createElement("a");
      link.href = "data:application/pdf;base64," + report.base64;
      link.download = report.fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      button.disabled = false;
      button.textContent = originalText;
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      button.textContent = originalText;
      showToast(error.message || "Unable to build leaderboard PDF.");
    })
    .getLeaderboardPdf(options);
}

    rewards.push({

      points: points,

      active: active,

      order: index + 1
