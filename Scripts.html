<script>

const PageNavigation = {
    currentPage: null,
    requestId: 0,
    loadingPage: null,
    pageCache: {},
    preloading: false,
    evaluationMode: "new",
    evaluationSessionId: null
};

const EvaluationSaves = {
    pending: 0,
    failed: false
};

function updateEvaluationSaveStatus(){
    const status = document.getElementById("evaluationSaveStatus");
    const finishButton = document.getElementById("finishSessionButton");

    if(status){
        status.style.display = "block";
        status.style.color = EvaluationSaves.failed ? "#b42318" : "#666";
        status.textContent = EvaluationSaves.failed
            ? "A change failed to save. Retry it before finishing."
            : EvaluationSaves.pending > 0
                ? "Saving " + EvaluationSaves.pending + " change(s)…"
                : "All changes saved.";
    }

    if(finishButton){
        finishButton.disabled = EvaluationSaves.pending > 0 || EvaluationSaves.failed;
    }
}

function beginEvaluationSave(){
    EvaluationSaves.pending++;
    updateEvaluationSaveStatus();
}

function endEvaluationSave(succeeded){
    EvaluationSaves.pending = Math.max(0, EvaluationSaves.pending - 1);
    EvaluationSaves.failed = EvaluationSaves.failed || !succeeded;
    updateEvaluationSaveStatus();
}

function retryEvaluationSave(){
    EvaluationSaves.failed = false;
    beginEvaluationSave();
}

function resetEvaluationSaveState(){
    EvaluationSaves.pending = 0;
    EvaluationSaves.failed = false;
    updateEvaluationSaveStatus();
}

function isCurrentPage(page, requestId){
    return PageNavigation.currentPage === page &&
        (requestId == null || PageNavigation.requestId === requestId);
}

function loadPage(page, callback){

    if(page !== "Game"){
        document.body.classList.remove("live-game-setup-mode");
    }

    if(PageNavigation.loadingPage === page){
        return;
    }

    const requestId = ++PageNavigation.requestId;
    PageNavigation.loadingPage = page;

    if(PageNavigation.pageCache[page]){
        renderCoachIQPage_(page, PageNavigation.pageCache[page], requestId, callback);
        return;
    }

    google.script.run
    .withSuccessHandler(function(html){
        PageNavigation.pageCache[page] = html;
        renderCoachIQPage_(page, html, requestId, callback);

    })
    .withFailureHandler(function(error){

        if(requestId !== PageNavigation.requestId){
            return;
        }

        PageNavigation.loadingPage = null;

        console.error(error);

        showToast(
            (error && error.message) || "Unable to load page.",
            "error"
        );

    })
    .getPage(page);

}

function renderCoachIQPage_(page, html, requestId, callback){
    if(requestId !== PageNavigation.requestId){return;}
    const container=document.getElementById("page-content");
    if(!container){PageNavigation.loadingPage=null;console.error("page-content not found.");return;}
    container.innerHTML=html;
    const content=document.getElementById("content");if(content){content.scrollTop=0;}
    PageNavigation.currentPage=page;PageNavigation.loadingPage=null;updatePointTerminology();
    document.querySelectorAll(".nav-item").forEach(function(item){item.classList.toggle("active",item.dataset.page===page);});
    requestAnimationFrame(function(){
        if(!isCurrentPage(page,requestId)){return;}
        const loaders={Dashboard:loadDashboard,Players:loadPlayers,Sessions:loadSessions,Game:loadLiveGameSetup,
          Evaluations:initializeEvaluationsPage,Leaderboard:loadLeaderboard,Settings:loadSettings,Staff:loadStaff,AI:loadIntelligence};
        if(loaders[page]){loaders[page](requestId);}else if(page==="PlayerProfile"){loadPlayerProfile();}
        if(typeof callback==="function"){callback();}
    });
}

function preloadCoachIQPages(){
    if(PageNavigation.preloading){return;}
    PageNavigation.preloading=true;
    google.script.run.withSuccessHandler(function(pages){
        Object.keys(pages||{}).forEach(function(page){PageNavigation.pageCache[page]=pages[page];});
        PageNavigation.preloading=false;
    }).withFailureHandler(function(){PageNavigation.preloading=false;}).getCoachIQPageBundle();
}

function loadPlayers(requestId){

  const cachedPlayers=getCoachIQCachedData_("players");if(cachedPlayers){showPlayers(cachedPlayers,requestId);}

  google.script.run
    .withSuccessHandler(function(players){
      if(isCurrentPage("Players", requestId)){
        setCoachIQCachedData_("players",players||[]);
        showPlayers(players, requestId);
      }
    })
    .getPlayersForUI();

}

const CoachIQ = {

  settings: {},

  players: [],

  rosterImport: [],

  dataCache: {},

  dataCacheAt: {},

  liveGame: {setup:null, objectives:[], manualRoster:[], tracker:null, saving:false, lastGameId:"", tapQueue:[], protectedTaps:[], tapTimer:null, syncing:false, adjustmentDraft:[], adjustmentType:"Live Adjustment"}

};

function getCoachIQCachedData_(key){
  const savedAt=Number(CoachIQ.dataCacheAt[key]||0);
  return savedAt&&Date.now()-savedAt<15000?CoachIQ.dataCache[key]:null;
}
function setCoachIQCachedData_(key,value){CoachIQ.dataCache[key]=value;CoachIQ.dataCacheAt[key]=Date.now();}

function loadLiveGameSetup(requestId){
  document.body.classList.remove("live-game-mode");
  document.body.classList.add("live-game-setup-mode");
  google.script.run
    .withSuccessHandler(function(setup){
      if(!isCurrentPage("Game", requestId)){ return; }
      CoachIQ.liveGame.setup = setup;
      CoachIQ.liveGame.objectives = [];
      populateLiveGameSetup(setup);
    })
    .withFailureHandler(function(error){
      const loading = document.getElementById("liveGameSetupLoading");
      if(loading){ loading.textContent = error.message || "Unable to load Live Game setup."; }
      showToast("Unable to load Live Game setup.", "error");
    })
    .getLiveGameSetupData();
}

function populateLiveGameSetup(setup){
  const loading = document.getElementById("liveGameSetupLoading");
  const form = document.getElementById("liveGameSetupForm");
  const teamSelect = document.getElementById("liveGameTeam");
  if(!form || !teamSelect){ return; }

  const teams = setup.teams || [];
  teamSelect.innerHTML = teams.length
    ? teams.map(function(team){ return `<option value="${escapeHtmlValue(team)}">${escapeHtmlValue(team)}</option>`; }).join("")
    : '<option value="">Add a team in Settings first</option>';
  teamSelect.disabled = !teams.length;
  document.getElementById("liveGameDate").value = new Date().toISOString().split("T")[0];
  document.getElementById("liveGameType").value = setup.defaults.gameType || "Official Game";
  document.getElementById("liveGameLocation").value = setup.defaults.location || "Home";
  const sportSelect = document.getElementById("liveGameSport");
  const sportPresets = setup.sportPresets || {};
  sportSelect.innerHTML = Object.keys(sportPresets).map(function(sport){
    return `<option value="${escapeHtmlValue(sport)}">${escapeHtmlValue(sport)}</option>`;
  }).join("");
  sportSelect.value = setup.sport || "Basketball";
  applyLiveGameSportPreset_(sportSelect.value, true);
  renderLiveGameRoster();
  updateObjectiveBuilderFields();
  renderLiveGameObjectives();
  renderRecentLiveGames(setup.recentGames || []);
  renderCompletedLiveGames(setup.completedGames || []);
  renderLiveGameTemplateOptions();
  updateLiveGameType();
  if(loading){ loading.hidden = true; }
  form.hidden = false;
}

function renderRecentLiveGames(games){
  const panel = document.getElementById("liveGameResumePanel");
  if(!panel || !games.length){ if(panel){ panel.hidden = true; } return; }
  panel.innerHTML = '<div class="live-game-resume-heading"><div><strong>Resume a Saved Game</strong><p>Continue a setup or live game already stored in the Games sheet.</p></div></div>' +
    '<div class="live-game-resume-list">' + games.map(function(game){
      return `<button type="button" onclick="openLiveGameTracker('${escapeHtmlValue(game.gameId)}')"><span><strong>${escapeHtmlValue(game.team)} vs. ${escapeHtmlValue(game.opponent)}</strong>` +
        `<small>${escapeHtmlValue(game.gameDate)} · ${escapeHtmlValue(game.gameType)}</small></span><b>${escapeHtmlValue(game.status)}</b></button>`;
    }).join("") + '</div>';
  panel.hidden = false;
}

function renderCompletedLiveGames(games){
  const panel=document.getElementById("liveGameHistoryPanel");
  if(!panel||!games.length){if(panel){panel.hidden=true;}return;}
  panel.innerHTML='<div class="live-game-resume-heading"><div><strong>Completed Game Reports</strong><p>Review game-plan execution and patterns CoachIQ is carrying forward.</p></div></div><div class="live-game-resume-list">'+games.map(function(game){
    const score=game.scored?game.achieved+" of "+game.scored+" achieved":"Tracking report";
    return `<button type="button" onclick="openLiveGamePostgameReport('${escapeHtmlValue(game.gameId)}')"><span><strong>${escapeHtmlValue(game.team)} vs. ${escapeHtmlValue(game.opponent)}</strong><small>${escapeHtmlValue(game.gameDate)} · ${escapeHtmlValue(score)}</small></span><b>Report</b></button>`;
  }).join("")+'</div>'; panel.hidden=false;
}

function openLiveGamePostgameReport(gameId){
  google.script.run.withSuccessHandler(function(report){renderLiveCheckpointReport(report);}).withFailureHandler(function(error){showToast(error.message||"Unable to open the postgame report.","error");}).getLiveGamePostgameReport(gameId);
}

function renderLiveGameRoster(){
  const container = document.getElementById("liveGameRoster");
  const team = document.getElementById("liveGameTeam");
  const setup = CoachIQ.liveGame.setup || {};
  if(!container || !team){ return; }
  const players = (setup.players || []).filter(function(player){
    return player.team === team.value && player.status !== "Archived";
  });
  const registeredHtml = players.map(function(player){
    const name = (player.firstName + " " + player.lastName).trim();
    return `<label class="live-game-player"><input class="live-game-player-check" type="checkbox" value="${escapeHtmlValue(player.id)}" checked>` +
      `<span class="live-game-jersey">${escapeHtmlValue(player.jersey || "—")}</span><span><strong>${escapeHtmlValue(name)}</strong>` +
      `<small>${escapeHtmlValue(player.position || "Unassigned")}</small></span></label>`;
  }).join("");
  const manualHtml=(CoachIQ.liveGame.manualRoster||[]).map(function(player){
    return `<div class="live-game-player live-game-manual-roster-player"><input class="live-game-player-check live-game-guest-check" type="checkbox" value="${escapeHtmlValue(player.id)}" checked>`+
      `<span class="live-game-jersey">${escapeHtmlValue(player.jersey||"—")}</span><span><strong>${escapeHtmlValue(player.name)}</strong><small>Game-only player</small></span>`+
      `<button type="button" aria-label="Remove ${escapeHtmlValue(player.name)}" onclick="removeManualLiveGamePlayer('${escapeHtmlValue(player.id)}')">×</button></div>`;
  }).join("");
  container.innerHTML=registeredHtml+manualHtml||'<div class="live-game-empty">No players are available yet. Add a game-only player above.</div>';
  updateObjectiveBuilderFields();
}

function addManualLiveGamePlayer(){
  const nameInput=document.getElementById("liveGameManualPlayerName");
  const jerseyInput=document.getElementById("liveGameManualPlayerJersey");
  const name=String(nameInput&&nameInput.value||"").trim();
  if(!name){showToast("Enter the player's name first.","error");return;}
  if((CoachIQ.liveGame.manualRoster||[]).length>=20){showToast("A game can include up to 20 game-only players.","error");return;}
  CoachIQ.liveGame.manualRoster.push({id:"GUEST-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase(),name:name,jersey:String(jerseyInput&&jerseyInput.value||"").trim()});
  nameInput.value="";if(jerseyInput){jerseyInput.value="";}renderLiveGameRoster();
}

function removeManualLiveGamePlayer(id){
  CoachIQ.liveGame.manualRoster=(CoachIQ.liveGame.manualRoster||[]).filter(function(player){return player.id!==id;});
  CoachIQ.liveGame.objectives=CoachIQ.liveGame.objectives.filter(function(objective){return objective.playerId!==id;});
  renderLiveGameRoster();renderLiveGameObjectives();
}

function handleLiveGameTeamChange(){renderLiveGameRoster();renderLiveGameTemplateOptions();}
function renderLiveGameTemplateOptions(){
  const select=document.getElementById("liveGameTemplateSelect");const team=document.getElementById("liveGameTeam");if(!select||!team){return;}
  const templates=((CoachIQ.liveGame.setup||{}).gamePlanTemplates||[]).filter(function(item){return item.team===team.value;});
  select.innerHTML='<option value="">Choose saved template</option>'+templates.map(function(item){return `<option value="${escapeHtmlValue(item.templateId)}">${escapeHtmlValue(item.name)}</option>`;}).join("");
  const last=((CoachIQ.liveGame.setup||{}).lastGamePlans||{})[team.value];const button=document.getElementById("useLastLiveGamePlanButton");if(button){button.disabled=!last;button.title=last?"Last used against "+last.opponent:"No previous game plan found";}
}
function cloneLiveGamePlan(objectives){return (objectives||[]).map(function(item,index){const copy=Object.assign({},item);copy.active=true;copy.order=index;copy.addedDuringGame=false;return copy;});}
function confirmReplaceLiveGamePlan(objectives,label){
  const apply=function(){CoachIQ.liveGame.objectives=cloneLiveGamePlan(objectives);renderLiveGameObjectives();showToast(label+" loaded.");};
  if(CoachIQ.liveGame.objectives.length){showConfirmModal("Replace current objectives?","This will replace the objectives currently in the builder.","Replace Plan",apply);}else{apply();}
}
function applySelectedLiveGameTemplate(){
  const select=document.getElementById("liveGameTemplateSelect");if(!select||!select.value){showToast("Choose a saved template first.","error");return;}
  const template=((CoachIQ.liveGame.setup||{}).gamePlanTemplates||[]).find(function(item){return item.templateId===select.value;});if(template){confirmReplaceLiveGamePlan(template.objectives,template.name);}
}
function useLastLiveGamePlan(){
  const team=document.getElementById("liveGameTeam").value;const plan=((CoachIQ.liveGame.setup||{}).lastGamePlans||{})[team];if(!plan){showToast("No previous game plan was found for this team.","error");return;}
  confirmReplaceLiveGamePlan(plan.objectives,"Last game plan");
}
function saveCurrentLiveGameTemplate(){
  const input=document.getElementById("liveGameTemplateName");const name=input.value.trim();if(!name){showToast("Name the template first.","error");return;}if(!CoachIQ.liveGame.objectives.length){showToast("Add at least one objective first.","error");return;}
  const button=input.nextElementSibling;button.disabled=true;button.textContent="Saving…";
  google.script.run.withSuccessHandler(function(template){button.disabled=false;button.textContent="Save Current Plan as Template";input.value="";CoachIQ.liveGame.setup.gamePlanTemplates=(CoachIQ.liveGame.setup.gamePlanTemplates||[]).concat([template]);renderLiveGameTemplateOptions();document.getElementById("liveGameTemplateSelect").value=template.templateId;showToast("Game plan template saved.");}).withFailureHandler(function(error){button.disabled=false;button.textContent="Save Current Plan as Template";showToast(error.message||"Unable to save template.","error");}).saveLiveGamePlanTemplate({name:name,team:document.getElementById("liveGameTeam").value,objectives:CoachIQ.liveGame.objectives});
}

function setLiveGameRosterSelection(selected){
  document.querySelectorAll(".live-game-player-check").forEach(function(input){ input.checked = selected; });
}

function updateObjectiveBuilderFields(){
  const metric = document.getElementById("objectiveMetric");
  const goal = document.getElementById("objectiveGoal");
  const subject = document.getElementById("objectiveSubject");
  if(!metric || !goal || !subject){ return; }
  document.getElementById("objectiveCustomLabelWrap").hidden = metric.value !== "Custom";
  const comparison = goal.value === "comparison";
  document.getElementById("objectiveSubjectWrap").hidden = comparison;
  document.getElementById("objectiveDirectionWrap").hidden = !comparison;
  document.getElementById("objectiveTargetWrap").hidden = goal.value === "track";
  const playerSubject = !comparison && (subject.value === "our_player" || subject.value === "opponent_player");
  document.getElementById("objectivePlayerWrap").hidden = !playerSubject;
  const control = document.getElementById("objectivePlayerControl");
  if(playerSubject && control){
    if(subject.value === "our_player"){
      const team = document.getElementById("liveGameTeam").value;
      const players = ((CoachIQ.liveGame.setup || {}).players || []).filter(function(player){ return player.team === team; }).map(function(player){return{id:player.id,name:(player.firstName+" "+player.lastName).trim()};})
        .concat((CoachIQ.liveGame.manualRoster||[]).map(function(player){return{id:player.id,name:player.name+" (game only)"};}));
      control.innerHTML = '<select id="objectivePlayer">' + players.map(function(player){ return `<option value="${escapeHtmlValue(player.id)}">${escapeHtmlValue(player.name)}</option>`; }).join("") + '</select>';
    } else {
      control.innerHTML = '<input id="objectivePlayer" maxlength="60" placeholder="Opponent player name">';
    }
  }
  const defaults = {"Transition Points":["points","higher"],"Offensive Rebounds":["count","higher"],"Turnovers":["count","lower"],"Fouls":["count","lower"],"Points":["points","higher"]};
  const setup=CoachIQ.liveGame.setup||{};
  const selectedPreset=((setup.sportPresets||{})[setup.selectedSport]||{});
  const sportObjective=(selectedPreset.objectives||[]).find(function(item){return item.label===metric.value;});
  const preset = sportObjective?[sportObjective.unit,sportObjective.direction]:defaults[metric.value];
  if(preset){ document.getElementById("objectiveUnit").value=preset[0]; document.getElementById("objectiveDirection").value=preset[1]; }
  const unit=document.getElementById("objectiveUnit"),target=document.getElementById("objectiveTarget");
  if(unit&&target){target.max=unit.value==="percentage"?100:9999;if(unit.value==="percentage"&&Number(target.value)>100){target.value=100;}}
}

function addLiveGameObjective(){
  const metric = document.getElementById("objectiveMetric").value;
  const label = metric === "Custom" ? document.getElementById("objectiveCustomLabel").value.trim() : metric;
  const goalType = document.getElementById("objectiveGoal").value;
  const subject = goalType === "comparison" ? "both_teams" : document.getElementById("objectiveSubject").value;
  if(!label){ showToast("Name the objective first.", "error"); return; }
  if(CoachIQ.liveGame.objectives.length >= 12){ showToast("Keep the game plan focused to 12 objectives or fewer.", "error"); return; }
  const playerControl = document.getElementById("objectivePlayer");
  let playerId="", playerLabel="";
  if(subject === "our_player" && playerControl){ playerId=playerControl.value; playerLabel=playerControl.options[playerControl.selectedIndex] ? playerControl.options[playerControl.selectedIndex].text : ""; }
  if(subject === "opponent_player" && playerControl){ playerLabel=playerControl.value.trim(); }
  if((subject === "our_player" || subject === "opponent_player") && !playerId && !playerLabel){ showToast("Choose or name the player.", "error"); return; }
  const slug=label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,45)||"item";
  CoachIQ.liveGame.objectives.push({id:"objective_"+slug+"_"+Date.now().toString(36),label:label,goalType:goalType,subject:subject,
    unit:document.getElementById("objectiveUnit").value,target:Number(document.getElementById("objectiveTarget").value||0),
    direction:document.getElementById("objectiveDirection").value,playerId:playerId,playerLabel:playerLabel});
  document.getElementById("objectiveCustomLabel").value="";
  renderLiveGameObjectives();
}

function removeLiveGameObjective(id){ CoachIQ.liveGame.objectives=CoachIQ.liveGame.objectives.filter(function(item){return item.id!==id;}); renderLiveGameObjectives(); }
function renderLiveGameObjectives(){
  const container=document.getElementById("liveGameObjectives"); if(!container){return;}
  const names={comparison:"Win the battle",minimum:"Reach at least",maximum:"Stay under",track:"Just track"};
  container.innerHTML=CoachIQ.liveGame.objectives.map(function(item){
    const target=item.goalType==="track"?"":` · ${item.goalType==="comparison"?(item.direction==="lower"?"fewer is better":"more is better"):(names[item.goalType]+" "+item.target)}`;
    return `<div class="objective-plan-item"><span><strong>${escapeHtmlValue(item.label)}</strong><small>${escapeHtmlValue(names[item.goalType])}${escapeHtmlValue(target)}${item.playerLabel?" · "+escapeHtmlValue(item.playerLabel):""}</small></span><button type="button" onclick="removeLiveGameObjective('${escapeHtmlValue(item.id)}')">Remove</button></div>`;
  }).join("")||'<div class="live-game-empty">Add the two to five details that define winning today.</div>';
}

function updateLiveGameType(){
  const type = document.getElementById("liveGameType");
  const opponent = document.getElementById("liveGameOpponent");
  const label = document.getElementById("liveGameOpponentLabel");
  if(!type || !opponent || !label){ return; }
  const scrimmage = type.value === "Practice Scrimmage";
  label.textContent = scrimmage ? "Opponent / Scrimmage Side" : "Opponent";
  opponent.placeholder = scrimmage ? "Intrasquad (optional)" : "Opponent name";
}

function updateLiveGameSport(){
  const sport=document.getElementById("liveGameSport");
  if(!sport){return;}
  applyLiveGameSportPreset_(sport.value,false);
  showToast(sport.value+" formats and winning objectives loaded.");
}

function applyLiveGameSportPreset_(sport,initialLoad){
  const setup=CoachIQ.liveGame.setup||{};
  const preset=(setup.sportPresets||{})[sport];
  if(!preset){return;}
  setup.selectedSport=sport;
  setup.sportFormats=preset.formats||[];
  setup.sportObjectives=preset.objectives||[];
  const formatSelect=document.getElementById("liveGameFormat");
  formatSelect.innerHTML=setup.sportFormats.map(function(format){return `<option value="${escapeHtmlValue(format.name)}">${escapeHtmlValue(format.name)}</option>`;}).join("");
  const preferred=initialLoad&&setup.defaults?setup.defaults.format:"";
  formatSelect.value=setup.sportFormats.some(function(format){return format.name===preferred;})?preferred:((setup.sportFormats[0]||{}).name||"");
  updateLiveGameFormat();
  const metric=document.getElementById("objectiveMetric");
  if(metric){
    metric.innerHTML=setup.sportObjectives.map(function(objective){return `<option>${escapeHtmlValue(objective.label)}</option>`;}).join("")+'<option value="Custom">Custom Category</option>';
  }
  CoachIQ.liveGame.objectives=cloneLiveGamePlan(setup.sportObjectives);
  updateObjectiveBuilderFields();
  renderLiveGameObjectives();
}

function updateLiveGameFormat(){
  const format = document.getElementById("liveGameFormat");
  const length = document.getElementById("liveGamePeriodLength");
  const formats = ((CoachIQ.liveGame.setup || {}).sportFormats || []);
  const selected = formats.find(function(item){ return item.name === (format && format.value); });
  if(format && length && selected){ length.value = selected.periodLength; }
}

function submitLiveGameSetup(event){
  event.preventDefault();
  const button = document.getElementById("saveLiveGameSetupButton");
  if(!CoachIQ.liveGame.objectives.length){ showToast("Add at least one winning objective.", "error"); return; }
  const playerIds = Array.from(document.querySelectorAll(".live-game-player-check:checked")).map(function(input){ return input.value; });
  const selectedGuestIds=Array.from(document.querySelectorAll(".live-game-guest-check:checked")).map(function(input){return input.value;});
  const payload = {
    gameType:document.getElementById("liveGameType").value,
    gameDate:document.getElementById("liveGameDate").value,
    team:document.getElementById("liveGameTeam").value,
    opponent:document.getElementById("liveGameOpponent").value.trim(),
    location:document.getElementById("liveGameLocation").value,
    sport:document.getElementById("liveGameSport").value,
    format:document.getElementById("liveGameFormat").value,
    periodLength:Number(document.getElementById("liveGamePeriodLength").value),
    playerIds:playerIds.filter(function(id){return selectedGuestIds.indexOf(id)<0;}),
    guestPlayers:(CoachIQ.liveGame.manualRoster||[]).filter(function(player){return selectedGuestIds.indexOf(player.id)>=0;}),
    selectedStats:[],
    customStats:[],
    trackingObjectives:CoachIQ.liveGame.objectives
  };
  button.disabled = true;
  button.textContent = "Saving Setup…";
  google.script.run
    .withSuccessHandler(function(result){
      CoachIQ.liveGame.lastGameId = result.gameId;
      document.getElementById("liveGameSetupForm").hidden = true;
      document.getElementById("liveGameSetupSuccess").hidden = false;
      document.getElementById("liveGameSetupSuccessTitle").textContent = payload.team + " vs. " + (result.opponent || payload.opponent);
      document.getElementById("openSavedLiveGameButton").onclick = function(){ openLiveGameTracker(result.gameId); };
      button.disabled = false;
      button.textContent = "Save Game Plan";
      showToast(result.message || "Game setup saved.");
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      button.textContent = "Save Game Plan";
      showToast(error.message || "Unable to save game setup.", "error");
    })
    .createLiveGameSetup(payload);
}

function openLiveGameTracker(gameId){
  const form = document.getElementById("liveGameSetupForm");
  const success = document.getElementById("liveGameSetupSuccess");
  const resume = document.getElementById("liveGameResumePanel");
  const tracker = document.getElementById("liveGameTracker");
  if(form){ form.hidden = true; }
  if(success){ success.hidden = true; }
  if(resume){ resume.hidden = true; }
  if(tracker){ tracker.hidden = false; }
  CoachIQ.liveGame.tapQueue=[];
  CoachIQ.liveGame.syncing=false;
  document.body.classList.add("live-game-mode");
  const content = document.getElementById("content");
  if(content){ content.scrollTop = 0; }
  setLiveTrackerSaveState("Opening game…", "saving");
  google.script.run
    .withSuccessHandler(function(data){
      CoachIQ.liveGame.tracker = data;
      CoachIQ.liveGame.selectedPlayerId = data.players.length ? data.players[0].id : "";
      renderLiveGameTracker(data);
      recoverProtectedLiveGameTaps(data);
    })
    .withFailureHandler(function(error){
      setLiveTrackerSaveState(error.message || "Unable to open the game.", "error");
      showToast(error.message || "Unable to open the game.", "error");
    })
    .startLiveGame(gameId);
}

function exitLiveGameTracker(){
  flushLiveObjectiveQueue(function(){
    document.body.classList.remove("live-game-mode");
    CoachIQ.liveGame.tracker = null;
    CoachIQ.liveGame.selectedPlayerId = "";
    loadPage("Game");
  });
}

function renderLiveGameTracker(data){
  CoachIQ.liveGame.tracker=data;
  document.getElementById("liveTrackerTeam").textContent=data.game.team;
  document.getElementById("liveTrackerOpponent").textContent=data.game.opponent;
  document.getElementById("liveTrackerPeriodLabel").textContent=liveGamePeriodName(data.game.format,data.game.currentPeriod);
  renderLiveTrackerObjectives(data);
  renderLiveTrackerEvents(data);
  setLiveTrackerSaveState("All taps saved", "saved");
}

function liveGamePeriodName(format,period){
  const name=String(format||"").toLowerCase();
  if(name.indexOf("half")>=0) return period===1?"First Half":period===2?"Second Half":"OT "+(period-2);
  if(name.indexOf("inning")>=0) return "Inning "+period;
  if(name.indexOf("set")>=0) return "Set "+period;
  if(name.indexOf("period")>=0) return "Period "+period;
  return period<=4?"Quarter "+period:"OT "+(period-4);
}

function objectiveDisplayValue(objective,total){ return objective.subject.indexOf("opponent_")===0?total.opponent:total.our; }
function objectiveStatus(objective,total){
  if(objective.goalType==="comparison"){ const margin=objective.direction==="lower"?total.opponent-total.our:total.our-total.opponent; const required=Math.max(1,Number(objective.target||0)); return margin>=required?"winning":margin>=0?"even":"behind"; }
  const value=objectiveDisplayValue(objective,total);
  if(objective.goalType==="minimum") return value>=objective.target?"winning":"behind";
  if(objective.goalType==="maximum") return value<=objective.target?"winning":"behind";
  return "neutral";
}
function objectiveButtons(objective,side){
  if(objective.unit==="percentage"){
    return `<div class="objective-tap-buttons percentage"><button type="button" onclick="recordLiveObjectiveChange('${escapeHtmlValue(objective.id)}','${side}',1,'made')">+ Success</button><button type="button" onclick="recordLiveObjectiveChange('${escapeHtmlValue(objective.id)}','${side}',1,'attempt')">+ Miss</button></div>`;
  }
  const deltas=objective.unit==="points"?[1,2,3]:[1];
  return '<div class="objective-tap-buttons">'+deltas.map(function(delta){return `<button type="button" onclick="recordLiveObjectiveChange('${escapeHtmlValue(objective.id)}','${side}',${delta})">+${delta}</button>`;}).join("")+`<button class="minus" type="button" onclick="recordLiveObjectiveChange('${escapeHtmlValue(objective.id)}','${side}',-1)">−1</button></div>`;
}
function renderLiveTrackerObjectives(data){
  const container=document.getElementById("liveTrackerObjectives"); if(!container){return;}
  container.innerHTML=(data.objectives||[]).filter(function(objective){return objective.active!==false;}).map(function(objective){
    const total=(data.objectiveTotals||{})[objective.id]||{our:0,opponent:0};
    const status=objectiveStatus(objective,total);
    const suffix=objective.unit==="percentage"?"%":"";
    const ourDetail=objective.unit==="percentage"?`<em>${total.ourMade||0}/${total.ourAttempts||0}</em>`:"";
    const opponentDetail=objective.unit==="percentage"?`<em>${total.opponentMade||0}/${total.opponentAttempts||0}</em>`:"";
    if(objective.subject==="both_teams") return `<article class="objective-card ${status}"><header><div><span>${escapeHtmlValue(objective.goalType==="comparison"?"GAME-PLAN BATTLE":"TRACK")}</span><h3>${escapeHtmlValue(objective.label)}</h3></div><b>${status}</b></header><div class="objective-comparison"><section><small>${escapeHtmlValue(data.game.team)}</small><strong>${total.our}${suffix}</strong>${ourDetail}${objectiveButtons(objective,"Us")}</section><i>VS</i><section><small>${escapeHtmlValue(data.game.opponent)}</small><strong>${total.opponent}${suffix}</strong>${opponentDetail}${objectiveButtons(objective,"Opponent")}</section></div></article>`;
    const value=objectiveDisplayValue(objective,total); const who=objective.playerLabel|| (objective.subject.indexOf("opponent_")===0?data.game.opponent:data.game.team); const side=objective.subject.indexOf("opponent_")===0?"Opponent":"Us";
    const goal=objective.goalType==="minimum"?"Goal: "+objective.target+suffix+"+":objective.goalType==="maximum"?"Limit: "+objective.target+suffix:"Live "+(objective.unit==="percentage"?"percentage":"count");
    const detail=objective.unit==="percentage"?(side==="Opponent"?(total.opponentMade||0)+"/"+(total.opponentAttempts||0):(total.ourMade||0)+"/"+(total.ourAttempts||0)):"";
    return `<article class="objective-card ${status}"><header><div><span>${escapeHtmlValue(who)}</span><h3>${escapeHtmlValue(objective.label)}</h3></div><b>${status}</b></header><div class="objective-single"><strong>${value}${suffix}</strong>${detail?`<em>${detail}</em>`:""}<small>${escapeHtmlValue(goal)}</small>${objectiveButtons(objective,side)}</div></article>`;
  }).join("");
}
function recordLiveObjectiveChange(objectiveId,side,delta,component){
  if(!CoachIQ.liveGame.tracker){return;}
  const eventId="CEVT-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  const event={eventId:eventId,objectiveId:objectiveId,side:side,delta:delta,component:component||"",period:CoachIQ.liveGame.tracker.game.currentPeriod};
  applyOptimisticLiveObjectiveTap(event);
  CoachIQ.liveGame.tapQueue.push(event);
  CoachIQ.liveGame.protectedTaps.push(event);
  persistProtectedLiveGameTaps();
  setLiveTrackerSaveState(CoachIQ.liveGame.tapQueue.length+" tap"+(CoachIQ.liveGame.tapQueue.length===1?"":"s")+" queued…","saving");
  clearTimeout(CoachIQ.liveGame.tapTimer);
  CoachIQ.liveGame.tapTimer=setTimeout(function(){flushLiveObjectiveQueue();},180);
}
function applyOptimisticLiveObjectiveTap(event){
  const tracker=CoachIQ.liveGame.tracker; if(!tracker){return;}
  const total=tracker.objectiveTotals[event.objectiveId]||(tracker.objectiveTotals[event.objectiveId]={our:0,opponent:0});
  applyLiveObjectiveDelta_(total,event,1);
  tracker.events.unshift({eventId:event.eventId,eventType:event.objectiveId,side:event.side+(event.component?event.component==="made"?" Made":" Attempt":""),value:event.delta,component:event.component,period:event.period});
  tracker.events=tracker.events.slice(0,30);
  renderLiveTrackerObjectives(tracker); renderLiveTrackerEvents(tracker);
}
function applyLiveObjectiveDelta_(total,event,direction){
  const opponent=String(event.side||"").indexOf("Opponent")===0;
  const delta=Number(event.delta||0)*Number(direction||1);
  if(event.component){
    const madeKey=opponent?"opponentMade":"ourMade",attemptKey=opponent?"opponentAttempts":"ourAttempts",valueKey=opponent?"opponent":"our";
    if(event.component==="made"){total[madeKey]=Math.max(0,Number(total[madeKey]||0)+delta);total[attemptKey]=Math.max(total[madeKey],Number(total[attemptKey]||0)+delta);}
    else{total[attemptKey]=Math.max(Number(total[madeKey]||0),Number(total[attemptKey]||0)+delta);}
    total[valueKey]=total[attemptKey]?Math.round(total[madeKey]/total[attemptKey]*1000)/10:0;
  }else{
    const key=opponent?"opponent":"our";total[key]=Math.max(0,Number(total[key]||0)+delta);
  }
}
function flushLiveObjectiveQueue(callback){
  clearTimeout(CoachIQ.liveGame.tapTimer);
  if(CoachIQ.liveGame.syncing){ if(callback){setTimeout(function(){flushLiveObjectiveQueue(callback);},100);} return; }
  if(!CoachIQ.liveGame.tapQueue.length){ if(callback){callback();} return; }
  const tracker=CoachIQ.liveGame.tracker; if(!tracker){return;}
  const batch=CoachIQ.liveGame.tapQueue.splice(0,50); CoachIQ.liveGame.syncing=true;
  setLiveTrackerSaveState("Saving "+batch.length+" tap"+(batch.length===1?"":"s")+"…","saving");
  google.script.run.withSuccessHandler(function(){
    const savedIds={}; batch.forEach(function(item){savedIds[item.eventId]=true;});
    CoachIQ.liveGame.protectedTaps=CoachIQ.liveGame.protectedTaps.filter(function(item){return !savedIds[item.eventId];});
    persistProtectedLiveGameTaps();
    CoachIQ.liveGame.syncing=false;
    if(CoachIQ.liveGame.tapQueue.length){flushLiveObjectiveQueue(callback);}else{hideLiveGameRecovery();setLiveTrackerSaveState("All taps saved","saved");if(callback){callback();}}
  }).withFailureHandler(function(error){
    CoachIQ.liveGame.syncing=false;
    CoachIQ.liveGame.tapQueue=CoachIQ.liveGame.protectedTaps.slice();
    persistProtectedLiveGameTaps(); showLiveGameRecovery(CoachIQ.liveGame.protectedTaps.length,"Sync failed. Your taps remain protected on this device.");
    setLiveTrackerSaveState("Offline protection active","error"); showToast(error.message||"Unable to sync taps. They remain protected.","error");
    google.script.run.withSuccessHandler(function(data){renderLiveGameTracker(data);recoverProtectedLiveGameTaps(data);}).getLiveGameTracker(tracker.game.gameId);
  }).recordLiveGameObjectiveEvents(tracker.game.gameId,batch);
}
function liveGameRecoveryKey(gameId){return "coachiq_live_game_taps_"+String(gameId||"");}
function persistProtectedLiveGameTaps(){
  const tracker=CoachIQ.liveGame.tracker;if(!tracker){return;}
  try{const key=liveGameRecoveryKey(tracker.game.gameId);if(CoachIQ.liveGame.protectedTaps.length){localStorage.setItem(key,JSON.stringify({gameId:tracker.game.gameId,savedAt:new Date().toISOString(),taps:CoachIQ.liveGame.protectedTaps}));}else{localStorage.removeItem(key);}}catch(error){console.error("CoachIQ could not protect live taps locally: "+error.message);}
}
function recoverProtectedLiveGameTaps(data){
  let recovered=[];try{const stored=JSON.parse(localStorage.getItem(liveGameRecoveryKey(data.game.gameId))||"null");recovered=stored&&Array.isArray(stored.taps)?stored.taps:[];}catch(error){recovered=[];}
  if(!recovered.length){CoachIQ.liveGame.protectedTaps=[];hideLiveGameRecovery();return;}
  const serverIds={};(data.events||[]).forEach(function(event){serverIds[event.eventId]=true;});
  recovered=recovered.filter(function(event){return !serverIds[event.eventId];});
  CoachIQ.liveGame.protectedTaps=recovered.slice();CoachIQ.liveGame.tapQueue=recovered.slice();persistProtectedLiveGameTaps();
  recovered.forEach(applyOptimisticLiveObjectiveTap);
  if(recovered.length){showLiveGameRecovery(recovered.length,"Recovered after a refresh or interrupted connection. Retrying now.");setTimeout(retryProtectedLiveGameTaps,350);}else{hideLiveGameRecovery();}
}
function showLiveGameRecovery(count,message){const banner=document.getElementById("liveTrackerRecovery");if(!banner){return;}document.getElementById("liveTrackerRecoveryTitle").textContent=count+" protected tap"+(count===1?"":"s");document.getElementById("liveTrackerRecoveryMessage").textContent=message;banner.hidden=false;}
function hideLiveGameRecovery(){const banner=document.getElementById("liveTrackerRecovery");if(banner){banner.hidden=true;}}
function retryProtectedLiveGameTaps(){if(!CoachIQ.liveGame.tapQueue.length&&CoachIQ.liveGame.protectedTaps.length){CoachIQ.liveGame.tapQueue=CoachIQ.liveGame.protectedTaps.slice();}flushLiveObjectiveQueue();}
function renderLiveTrackerEvents(data){
  const container=document.getElementById("liveTrackerEvents"); if(!container){return;} const labels={}; (data.objectives||[]).forEach(function(item){labels[item.id]=item.label;});
  container.innerHTML=(data.events||[]).slice(0,8).map(function(event,index){const side=String(event.side||"");const percentageLabel=side.indexOf(" Made")>0?"Success":side.indexOf(" Attempt")>0?"Miss":"";const eventLabel=percentageLabel||((event.value>0?"+":"")+event.value);return `<div class="live-tracker-event"><span><strong>${escapeHtmlValue(eventLabel)} ${escapeHtmlValue(labels[event.eventType]||event.eventType)}</strong><small>${escapeHtmlValue(side.indexOf("Opponent")===0?data.game.opponent:data.game.team)} · ${escapeHtmlValue(liveGamePeriodName(data.game.format,event.period))}</small></span>${index===0?`<button type="button" onclick="undoLiveTrackerEvent('${escapeHtmlValue(event.eventId)}')">Undo</button>`:""}</div>`;}).join("")||'<div class="live-tracker-empty">No taps yet. The screen is ready.</div>';
}
function undoLatestLiveTrackerEvent(){
  const tracker=CoachIQ.liveGame.tracker; const event=((tracker||{}).events||[])[0]; if(!event){return;}
  const queuedIndex=CoachIQ.liveGame.tapQueue.findIndex(function(item){return item.eventId===event.eventId;});
  if(queuedIndex>=0){
    const queued=CoachIQ.liveGame.tapQueue.splice(queuedIndex,1)[0];
    CoachIQ.liveGame.protectedTaps=CoachIQ.liveGame.protectedTaps.filter(function(item){return item.eventId!==queued.eventId;});persistProtectedLiveGameTaps();
    const total=tracker.objectiveTotals[queued.objectiveId];applyLiveObjectiveDelta_(total,queued,-1);tracker.events.shift();
    renderLiveTrackerObjectives(tracker); renderLiveTrackerEvents(tracker);
    setLiveTrackerSaveState(CoachIQ.liveGame.tapQueue.length?CoachIQ.liveGame.tapQueue.length+" taps queued…":"All taps saved",CoachIQ.liveGame.tapQueue.length?"saving":"saved");
    return;
  }
  flushLiveObjectiveQueue(function(){undoLiveTrackerEvent(event.eventId);});
}
function undoLiveTrackerEvent(eventId){ if(CoachIQ.liveGame.saving||!CoachIQ.liveGame.tracker){return;} CoachIQ.liveGame.saving=true; setLiveTrackerSaveState("Undoing tap…","saving"); google.script.run.withSuccessHandler(function(data){CoachIQ.liveGame.saving=false;renderLiveGameTracker(data);}).withFailureHandler(function(error){CoachIQ.liveGame.saving=false;showToast(error.message||"Unable to undo tap.","error");}).voidLiveGameEvent(CoachIQ.liveGame.tracker.game.gameId,eventId); }
function createLiveCheckpoint(type){ if(!CoachIQ.liveGame.tracker){return;} flushLiveObjectiveQueue(function(){ CoachIQ.liveGame.saving=true; setLiveTrackerSaveState("Building "+type.toLowerCase()+" intelligence…","saving"); google.script.run.withSuccessHandler(function(result){CoachIQ.liveGame.saving=false;renderLiveGameTracker(result.tracker);renderLiveCheckpointReport(result.report);}).withFailureHandler(function(error){CoachIQ.liveGame.saving=false;showToast(error.message||"Unable to build report.","error");}).createLiveGameCheckpoint(CoachIQ.liveGame.tracker.game.gameId,type); }); }

function renderLivePlanAdjustmentRows(){
  const container=document.getElementById("livePlanAdjustmentRows");
  container.innerHTML=CoachIQ.liveGame.adjustmentDraft.map(function(item,index){return `<div class="plan-adjustment-row ${item.active===false?"paused":""}"><label><input type="checkbox" ${item.active===false?"":"checked"} onchange="toggleAdjustedObjective('${escapeHtmlValue(item.id)}',this.checked)"><span><strong>${escapeHtmlValue(item.label)}</strong><small>${item.addedDuringGame?"Added during game":"Original game plan"}</small></span></label><input type="number" min="0" value="${Number(item.target||0)}" aria-label="Target for ${escapeHtmlValue(item.label)}" onchange="updateAdjustedObjectiveTarget('${escapeHtmlValue(item.id)}',this.value)"><div><button type="button" ${index===0?"disabled":""} onclick="moveAdjustedObjective('${escapeHtmlValue(item.id)}',-1)">↑</button><button type="button" ${index===CoachIQ.liveGame.adjustmentDraft.length-1?"disabled":""} onclick="moveAdjustedObjective('${escapeHtmlValue(item.id)}',1)">↓</button></div></div>`;}).join("");
}
function toggleAdjustedObjective(id,active){const item=CoachIQ.liveGame.adjustmentDraft.find(function(row){return row.id===id;});if(item){item.active=active;}renderLivePlanAdjustmentRows();}
function updateAdjustedObjectiveTarget(id,value){const item=CoachIQ.liveGame.adjustmentDraft.find(function(row){return row.id===id;});if(item){item.target=Math.max(0,Number(value||0));}}
function moveAdjustedObjective(id,direction){const rows=CoachIQ.liveGame.adjustmentDraft;const index=rows.findIndex(function(row){return row.id===id;});const next=index+direction;if(index<0||next<0||next>=rows.length){return;}const item=rows.splice(index,1)[0];rows.splice(next,0,item);renderLivePlanAdjustmentRows();}
function addObjectiveDuringGame(){
  const label=document.getElementById("adjustmentObjectiveLabel").value.trim();if(!label){showToast("Name the new objective.","error");return;}
  const goal=document.getElementById("adjustmentObjectiveGoal").value;const slug=label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,45)||"item";

}

function downloadRosterTemplate(){
  const csv = [
    "First Name,Last Name,Jersey Number,Grade,Team,Position,Status",
    "Jordan,Smith,12,11,Varsity,Guard,Active"
  ].join("\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  link.download = "CoachIQ_Roster_Template.csv";
  document.body.appendChild(link);
  link.click();
  URL.revokeObjectURL(link.href);
  link.remove();
}

function previewRosterCsv(input){
  const file = input.files && input.files[0];
  const message = document.getElementById("rosterImportMessage");
  const button = document.getElementById("confirmRosterImport");
  const preview = document.getElementById("rosterImportPreview");
  CoachIQ.rosterImport = [];
  button.disabled = true;
  preview.innerHTML = "";

  if(!file){ return; }
  if(!/\.csv$/i.test(file.name)){
    message.className = "roster-import-message error";
    message.textContent = "Please select a CSV file.";
    return;
  }

  const reader = new FileReader();
  reader.onload = function(event){
    try{
      const rows = parseRosterCsv(event.target.result);
      if(rows.length < 2){
        throw new Error("The CSV must contain a header row and at least one player.");
      }
      if(rows.length - 1 > 500){
        throw new Error("A roster import is limited to 500 players at a time.");
      }

      const headers = rows[0].map(normalizeRosterHeader);
      const indexes = {
        firstName: findRosterHeader(headers, ["firstname", "first", "givenname"]),
        lastName: findRosterHeader(headers, ["lastname", "last", "surname", "familyname"]),
        jersey: findRosterHeader(headers, ["jerseynumber", "jersey", "number", "uniformnumber"]),
        grade: findRosterHeader(headers, ["grade", "class", "year"]),
        team: findRosterHeader(headers, ["team", "level", "squad"]),
        position: findRosterHeader(headers, ["position", "pos"]),
        status: findRosterHeader(headers, ["status", "playerstatus"])
      };

      if(indexes.firstName < 0 || indexes.lastName < 0){
        throw new Error("The CSV needs First Name and Last Name columns. Download the template for the expected format.");
      }

      const roster = rows.slice(1).filter(function(row){
        return row.some(function(value){ return String(value).trim() !== ""; });
      }).map(function(row){
        const value = function(index){ return index < 0 ? "" : String(row[index] || "").trim(); };
        return {
          firstName: value(indexes.firstName),
          lastName: value(indexes.lastName),
          jersey: value(indexes.jersey),
          grade: value(indexes.grade),
          team: value(indexes.team),
          position: value(indexes.position),
          status: value(indexes.status) || "Active"
        };
      });

      const invalidRows = roster.filter(function(player){
        return !player.firstName || !player.lastName;
      });
      if(!roster.length){
        throw new Error("No player rows were found in the CSV.");
      }
      if(invalidRows.length){
        throw new Error(invalidRows.length + " row(s) are missing a first or last name.");
      }

      CoachIQ.rosterImport = roster;
      message.className = "roster-import-message";
      message.textContent = roster.length + " player(s) ready to import. Review the preview, then select Import Players.";
      preview.innerHTML = buildRosterPreview(roster);
      button.disabled = false;
    }catch(error){
      message.className = "roster-import-message error";
      message.textContent = error.message || String(error);
    }
  };
  reader.onerror = function(){
    message.className = "roster-import-message error";
    message.textContent = "The selected CSV could not be read.";
  };
  reader.readAsText(file);
}

function parseRosterCsv(text){
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  for(let i = 0; i < text.length; i++){
    const character = text[i];
    if(character === '"'){
      if(quoted && text[i + 1] === '"'){
        value += '"';
        i += 1;
      }else{
        quoted = !quoted;
      }
    }else if(character === "," && !quoted){
      row.push(value);
      value = "";
    }else if((character === "\n" || character === "\r") && !quoted){
      if(character === "\r" && text[i + 1] === "\n"){ i += 1; }
      row.push(value);
      rows.push(row);
      row = [];
      value = "";
    }else{
      value += character;
    }
  }
  if(quoted){ throw new Error("The CSV contains an unclosed quoted value."); }
  if(value !== "" || row.length){
    row.push(value);
    rows.push(row);
  }
  return rows;
}

function normalizeRosterHeader(value){
  return String(value || "").replace(/^\uFEFF/, "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function findRosterHeader(headers, choices){
  for(let i = 0; i < choices.length; i++){
    const index = headers.indexOf(choices[i]);
    if(index >= 0){ return index; }
  }
  return -1;
}

  };
  const rows = roster.slice(0, 25).map(function(player){
    return `<tr><td>${escapeHtml(player.firstName)}</td><td>${escapeHtml(player.lastName)}</td>` +
      `<td>${escapeHtml(player.jersey)}</td><td>${escapeHtml(player.grade)}</td>` +
      `<td>${escapeHtml(player.team)}</td><td>${escapeHtml(player.position)}</td>` +
      `<td>${escapeHtml(player.status)}</td></tr>`;
  }).join("");
  const remainder = roster.length > 25
    ? `<p>Showing the first 25 of ${roster.length} players.</p>` : "";
  return remainder + `<table><thead><tr><th>First Name</th><th>Last Name</th><th>#</th>` +

function applyCoachIQTheme(settings){
  settings = settings || {};
  CoachIQ.programSettings = settings;
  const primary = validThemeColor(settings.primaryColor) ? settings.primaryColor : "#1E3A5F";
  const secondary = validThemeColor(settings.secondaryColor) ? settings.secondaryColor : "#F59E0B";
  const root = document.documentElement;
  root.style.setProperty("--primary", primary);
  root.style.setProperty("--primary-dark", shadeThemeColor(primary, -25));
  root.style.setProperty("--primary-light", shadeThemeColor(primary, 82));
  root.style.setProperty("--secondary", secondary);
  root.style.setProperty("--primary-text", readableThemeText(primary));

  const brand = document.getElementById("programBrandName");
  if(brand){ brand.textContent = settings.programName || "CoachIQ"; }

  if(logo){

function validThemeColor(value){
  return /^#[0-9a-f]{6}$/i.test(String(value || ""));
}

function readableThemeText(hex){
  const value = parseInt(hex.slice(1), 16);
  const red = value >> 16;
  const green = (value >> 8) & 255;
  const blue = value & 255;
  return (red * 299 + green * 587 + blue * 114) / 1000 >= 145 ? "#111827" : "#FFFFFF";
}

function shadeThemeColor(hex, percent){
  const value = parseInt(hex.slice(1), 16);
  const target = percent < 0 ? 0 : 255;
  const amount = Math.abs(percent) / 100;
  const channel = function(shift){
    const current = (value >> shift) & 255;
    return Math.round(current + (target - current) * amount).toString(16).padStart(2, "0");
  };
  return "#" + channel(16) + channel(8) + channel(0);
}

function visibleCoachIQTutorialSteps(){
  const capabilities=((CoachIQ.access || {}).capabilities || []);
  return CoachIQTutorial.steps.filter(function(step){return !step.capability || capabilities.indexOf(step.capability) >= 0;});
}

function advanceCoachIQTutorial(){
  clearTutorialHighlight();
  CoachIQTutorial.index += 1;
  while(CoachIQTutorial.index < CoachIQTutorial.steps.length){
    const candidate = CoachIQTutorial.steps[CoachIQTutorial.index];
    if(!candidate.capability || ((CoachIQ.access || {}).capabilities || []).indexOf(candidate.capability) >= 0){ break; }
    CoachIQTutorial.index += 1;
  }
  if(CoachIQTutorial.index >= CoachIQTutorial.steps.length){
    closeCoachIQTutorial();
    loadPage("Dashboard");
    showToast("Tour complete. CoachIQ is ready.");
    return;
  }

  const step = CoachIQTutorial.steps[CoachIQTutorial.index];
  const renderStep = function(){
    const visibleSteps=visibleCoachIQTutorialSteps();
    document.getElementById("tutorialProgress").textContent =
      "STEP " + (visibleSteps.indexOf(step) + 1) + " OF " + visibleSteps.length;
    document.getElementById("tutorialTitle").textContent = step.title;
    document.getElementById("tutorialBody").textContent = step.body;
    document.getElementById("tutorialNextButton").textContent =
      visibleSteps.indexOf(step) === visibleSteps.length - 1 ? "Finish Tour" : "Next";
    if(step.selector){
      const target = document.querySelector(step.selector);
      if(target){
        target.classList.add("tutorial-highlight");
        target.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }
  };

  if(PageNavigation.currentPage === step.page){
    renderStep();
  }else if(step.page === "Evaluations"){
    PageNavigation.evaluationMode = "new";
    PageNavigation.evaluationSessionId = null;
    loadPage(step.page, renderStep);
  }else{
    loadPage(step.page, renderStep);
  }
}

function initializeRatingButtons(){

    document.querySelectorAll(".rating-group").forEach(function(group){

        group.querySelectorAll(".rating-btn").forEach(function(button){

            button.addEventListener("click", function(){

                if(group.dataset.saving === "true"){
                    return;
                }

                const previousButton = group.querySelector(".rating-btn.selected");

                // Update button color
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                // Read button data
                const sessionId = button.dataset.session;
                const playerId = button.dataset.player;
                const category = button.dataset.category;
                const score = Number(button.dataset.score);

                group.dataset.saving = "true";
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.disabled = true;
                });
                retryEvaluationSave();

                // Save to Google Sheets
                google.script.run
                    .withSuccessHandler(function(){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                        });
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                            btn.classList.remove("selected");
                        });
                        if(previousButton){
                            previousButton.classList.add("selected");
                        }
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save score.");
                    })
                    .updateEvaluationScore(
                        sessionId,
                        playerId,
                        category,
                        score
                    );

            });

        });

    });

}
function initializeAttendanceCheckboxes(){

    document
        .querySelectorAll(".attendance-check")
        .forEach(function(box){

            box.addEventListener("change", function(){

                const row = box.closest(".evaluation-row");

                const sessionId = window.currentPracticeSession;

                const playerId = row.dataset.player;

                const buttons = row.querySelectorAll(".rating-btn");
                const newValue = box.checked;

                box.disabled = true;
                retryEvaluationSave();

                if(box.checked){

                    row.classList.remove("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = false;
                    });

                }else{

                    row.classList.add("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = true;
                    });

                }

                google.script.run
                    .withSuccessHandler(function(){
                        box.disabled = false;
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        box.checked = !newValue;
                        box.disabled = false;
                        row.classList.toggle("player-absent", !box.checked);
                        buttons.forEach(function(btn){
                            btn.disabled = !box.checked;
                        });
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save attendance.");
                    })
                    .updateAttendance(
                        sessionId,
                        playerId,
                        newValue
                    );

            });

        });

}

    });

function restoreEvaluationScores(scores){

  Object.keys(scores).forEach(function(playerId){

    const playerScores = scores[playerId];

    console.log("Player:", playerId);
console.log("Attendance:", playerScores.Attendance);
console.log("Type:", typeof playerScores.Attendance);
console.log(playerScores);

    // -------------------------
    // Restore Attendance
    // -------------------------

    const attendanceStatus=document.querySelector(`.evaluation-row[data-player="${playerId}"] .attendance-status`);
    if(attendanceStatus){attendanceStatus.value=playerScores.AttendanceStatus||(playerScores.Attendance===false?"Unexcused":"Present");attendanceStatus.dataset.saved=attendanceStatus.value;}

    if(playerScores.Attendance === false){

      const row = document.querySelector(
        `.evaluation-row[data-player="${playerId}"]`
      );

      if(row){

        const checkbox = row.querySelector(".attendance-check");

        checkbox.checked = false;

        row.classList.add("player-absent");

        row.querySelectorAll(".rating-btn").forEach(function(btn){
          btn.disabled = true;
        });

      }

    }

    // -------------------------
    // Restore Ratings
    // -------------------------

    Object.keys(playerScores).forEach(function(category){

  if(category === "Attendance"){
    return;
  }

  if(category === "Reward"){

    const dropdown = document.querySelector(
      `.reward-select[data-player="${playerId}"]`
    );

    if(dropdown){
      let rewardId = playerScores.Reward || "";

      if(rewardId && !Array.from(dropdown.options).some(function(option){
        return option.value === rewardId;
      })){
        const legacyReward = (window.pointRewards || []).find(function(reward){
          return reward["Reward Name"] === rewardId;
        });
        rewardId = legacyReward ? legacyReward["Reward ID"] : "";
      }

      dropdown.value = rewardId;
      dropdown.dataset.savedValue = rewardId;
      const indicator = document.querySelector(
        `.reward-indicator[data-player="${playerId}"]`
      );
      if(indicator){ indicator.hidden = !rewardId; }
    }

    return;

  }

  if(category === "Notes"){
    const preview = document.querySelector(
      `.evaluation-note-preview[data-player="${playerId}"]`
    );
    if(preview){
      preview.textContent = playerScores.Notes || "No note saved.";
      preview.title = playerScores.Notes || "";
    }
    const indicator = document.querySelector(
      `.note-indicator[data-player="${playerId}"]`
    );
    if(indicator){ indicator.hidden = !playerScores.Notes; }
    return;
  }

  const score = playerScores[category];

      if(score === "" || score == null){
        return;
      }

      const button = document.querySelector(
        `.rating-btn[data-player="${playerId}"][data-category="${category}"][data-score="${score}"]`
      );

      if(button){

        button.classList.add("selected");

      }

    });

  });

}

      dashboardAttendance:(data.attendance??"--")+"%",dashboardCulture:data.cultureScore??"--"};

      dashboardInsight:data.insight||"CoachIQ is analyzing your program.",dashboardFocus:data.focus||"Everything looks great today.",dashboardTrends:data.trends||"No trend data available."};

function renderLeaderboardData_(players,requestId){
  if(!isCurrentPage("Leaderboard",requestId)){return;}
  window.leaderboardPlayers=players||[];populateLeaderboardTeams(players||[]);filterLeaderboard();
}

function populateLeaderboardTeams(players){
  const select = document.getElementById("leaderboardTeam");
  if(!select){ return; }
  const selected = select.value;
  const teams = Array.from(new Set(players.map(function(player){
    return player.team;
  }).filter(Boolean))).sort();
  select.innerHTML = '<option value="">All Teams</option>' +
    teams.map(function(team){
      return '<option value="' + team + '">' + team + '</option>';
    }).join("");
  select.value = selected;
}

function filterLeaderboard(){
  const searchElement = document.getElementById("leaderboardSearch");
  const teamElement = document.getElementById("leaderboardTeam");
  const search = searchElement ? searchElement.value.trim().toLowerCase() : "";
  const team = teamElement ? teamElement.value : "";
  const players = (window.leaderboardPlayers || []).filter(function(player){
    const fullName = (player.firstName + " " + player.lastName).toLowerCase();
    return (!search || fullName.includes(search)) &&
      (!team || player.team === team);
  });
  showLeaderboard(players);
}
function showLeaderboard(players){

  const container = document.getElementById("leaderboardContent");

  let html = "";

  if(!players || players.length === 0){
    container.innerHTML = '<div class="leaderboard-empty">No players match these filters.</div>';
    return;
  }

  players.forEach(function(player){

    let badgeClass = "default-rank";
    let badgeText = player.rank;

    if(player.rank === 1){

      badgeClass = "gold";
      badgeText = "🥇";

    }else if(player.rank === 2){

      badgeClass = "silver";
      badgeText = "🥈";

    }else if(player.rank === 3){

      badgeClass = "bronze";
      badgeText = "🥉";

    }

    html += `

<div class="leaderboard-card"

onclick="openPlayerModal('${player.playerId}',false)">

<div style="display:flex;align-items:center;justify-content:space-between;">

<div style="display:flex;align-items:center;gap:20px;">

<div class="rank-badge ${badgeClass}">

${badgeText}

</div>

<div>

<div style="font-size:24px;font-weight:bold;">

${player.firstName} ${player.lastName}

</div>

<div style="margin-top:8px;color:#666;">

🏀 #${player.jersey}

&nbsp;&nbsp;

${player.team}

&nbsp;&nbsp;

Grade ${player.grade}

</div>

</div>

</div>

<div style="text-align:right;">

<div class="points-total">

${player.points}

</div>

<div class="points-label">

<span data-point-label>${getCoachIQPointLabels().points}</span>

</div>

<div style="margin-top:12px;">

🟢 ${player.positive}

&nbsp;&nbsp;

🔴 ${player.negative}

&nbsp;&nbsp;

⭐ Daily evaluations ${player.evaluationPoints || 0}

</div>

</div>

</div>

</div>

`;

  });

  container.innerHTML = html;

}

function downloadLeaderboardPdf(button){
  const originalText = button.textContent;
  const options = {
    search: document.getElementById("leaderboardSearch").value.trim(),
    team: document.getElementById("leaderboardTeam").value
  };
  button.disabled = true;
  button.textContent = "Building PDF…";
  google.script.run
    .withSuccessHandler(function(report){
      const link = document.createElement("a");
      link.href = "data:application/pdf;base64," + report.base64;
      link.download = report.fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      button.disabled = false;
      button.textContent = originalText;
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      button.textContent = originalText;
      showToast(error.message || "Unable to build leaderboard PDF.");
    })
    .getLeaderboardPdf(options);
}
function savePointRewards(){

  const rewards = [];

  document.querySelectorAll(".reward-row").forEach(function(row,index){

    const name = row.querySelector(".reward-name").value.trim();

    const points = Number(
      row.querySelector(".reward-points").value
    );

    const active =
      row.querySelector(".reward-active").checked;

    if(name === ""){
      return;
    }

    rewards.push({

      id: row.dataset.rewardId || "",

      name: name,

      points: points,

      active: active,

      order: index + 1

    });

  });

  google.script.run
    .withSuccessHandler(function(){

      showToast("Point Rewards Saved!");

      loadSettings(PageNavigation.requestId);

    })
    .withFailureHandler(function(error){
      console.error(error);
      const message = error && error.message
        ? error.message
        : String(error || "Unknown error");
      showToast("Unable to save rewards: " + message);
    })
    .savePointRewards(rewards);

}

console.log(rewards);

option.textContent =

function initializeRewardDropdowns(){

    document
        .querySelectorAll(".reward-select")
        .forEach(function(select){

            select.dataset.savedValue = select.value || "";

            select.addEventListener("change", function(){

                const playerId = select.dataset.player;
                const previousValue = select.dataset.savedValue || "";

                select.disabled = true;
                retryEvaluationSave();

                google.script.run
                .withSuccessHandler(function(){

                    select.dataset.savedValue = select.value;
                    const indicator = document.querySelector(
                      `.reward-indicator[data-player="${playerId}"]`
                    );
                    if(indicator){ indicator.hidden = !select.value; }
                    select.disabled = false;
                    endEvaluationSave(true);
                    showToast(select.value ? "Reward saved!" : "Reward cleared!");

                })
                .withFailureHandler(function(error){

                    console.error(error);
                    select.value = previousValue;
                    select.disabled = false;
                    endEvaluationSave(false);
                    showToast("Unable to save reward.");

                })
                .updateReward(
                    window.currentPracticeSession,
                    playerId,
                    select.value
                );

            });

        });
