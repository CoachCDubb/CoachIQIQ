<script>

const PageNavigation = {
    currentPage: null,
    requestId: 0,
    loadingPage: null,
    evaluationMode: "new",
    evaluationSessionId: null
};

const EvaluationSaves = {
    pending: 0,
    failed: false
};

function updateEvaluationSaveStatus(){
    const status = document.getElementById("evaluationSaveStatus");
    const finishButton = document.getElementById("finishSessionButton");

    if(status){
        status.style.display = "block";
        status.style.color = EvaluationSaves.failed ? "#b42318" : "#666";
        status.textContent = EvaluationSaves.failed
            ? "A change failed to save. Retry it before finishing."
            : EvaluationSaves.pending > 0
                ? "Saving " + EvaluationSaves.pending + " change(s)…"
                : "All changes saved.";
    }

    if(finishButton){
        finishButton.disabled = EvaluationSaves.pending > 0 || EvaluationSaves.failed;
    }
}

function beginEvaluationSave(){
    EvaluationSaves.pending++;
    updateEvaluationSaveStatus();
}

function endEvaluationSave(succeeded){
    EvaluationSaves.pending = Math.max(0, EvaluationSaves.pending - 1);
    EvaluationSaves.failed = EvaluationSaves.failed || !succeeded;
    updateEvaluationSaveStatus();
}

function retryEvaluationSave(){
    EvaluationSaves.failed = false;
    beginEvaluationSave();
}

function resetEvaluationSaveState(){
    EvaluationSaves.pending = 0;
    EvaluationSaves.failed = false;
    updateEvaluationSaveStatus();
}

function isCurrentPage(page, requestId){
    return PageNavigation.currentPage === page &&
        (requestId == null || PageNavigation.requestId === requestId);
}

function loadPage(page, callback){

    if(PageNavigation.loadingPage === page){
        return;
    }

    const requestId = ++PageNavigation.requestId;
    PageNavigation.loadingPage = page;

    google.script.run
    .withSuccessHandler(function(html){

        if(requestId !== PageNavigation.requestId){
            return;
        }

        const container = document.getElementById("page-content");

        if(!container){
            console.error("page-content not found.");
            return;
        }

        container.innerHTML = html;
        PageNavigation.currentPage = page;
        PageNavigation.loadingPage = null;
        updatePointTerminology();

        // Update Navigation
        document.querySelectorAll(".nav-item").forEach(function(item){

            item.classList.remove("active");

            if(item.dataset.page === page){
                item.classList.add("active");
            }

        });

        // Wait until browser finishes rendering
        requestAnimationFrame(function(){

            if(!isCurrentPage(page, requestId)){
                return;
            }

            switch(page){

                case "Dashboard":
                    loadDashboard(requestId);
                    break;

                case "Players":
                    loadPlayers(requestId);
                    break;

                case "Sessions":
                    loadSessions(requestId);
                    break;

                case "Evaluations":
                    initializeEvaluationsPage(requestId);
                    break;

                case "Leaderboard":
                    loadLeaderboard(requestId);
                    break;

                case "Settings":
                    loadSettings(requestId);
                    break;

                case "Staff":
                    loadStaff(requestId);
                    break;

                case "AI":
                    loadIntelligence(requestId);
                    break;

                case "PlayerProfile":
                    loadPlayerProfile();
                    break;

            }

            if(typeof callback === "function"){
                callback();
            }

        });

    })
    .withFailureHandler(function(error){

        if(requestId !== PageNavigation.requestId){
            return;
        }

        PageNavigation.loadingPage = null;

        console.error(error);

        showToast(
            "Unable to load page.",
            "error"
        );

    })
    .getPage(page);

}

function loadPlayers(requestId){

  google.script.run
    .withSuccessHandler(function(players){
      if(isCurrentPage("Players", requestId)){
        showPlayers(players, requestId);
      }
    })
    .getPlayersForUI();

}

const CoachIQ = {

  settings: {},

  players: [],

  rosterImport: []

};

function showPlayers(players, requestId){

  CoachIQ.players = players;

  loadDropdownSettings(function(settings){

    if(!isCurrentPage("Players", requestId)){
      return;
    }

    CoachIQ.settings = settings;

    populateTeamFilter(settings.teams);

    renderPlayers(players);

  });

}

function openRosterImportModal(){
  CoachIQ.rosterImport = [];
  const file = document.getElementById("rosterCsvFile");
  const preview = document.getElementById("rosterImportPreview");
  const message = document.getElementById("rosterImportMessage");
  const button = document.getElementById("confirmRosterImport");
  if(file){ file.value = ""; }
  if(preview){ preview.innerHTML = ""; }
  if(message){
    message.className = "roster-import-message";
    message.textContent = "Choose a CSV file to preview the roster before importing.";
  }
  if(button){ button.disabled = true; }
  document.getElementById("rosterImportModal").style.display = "block";
}

function closeRosterImportModal(){
  CoachIQ.rosterImport = [];
  const modal = document.getElementById("rosterImportModal");
  if(modal){ modal.style.display = "none"; }
}

function downloadRosterTemplate(){
  const csv = [
    "First Name,Last Name,Jersey Number,Grade,Team,Position,Status",
    "Jordan,Smith,12,11,Varsity,Guard,Active"
  ].join("\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  link.download = "CoachIQ_Roster_Template.csv";
  document.body.appendChild(link);
  link.click();
  URL.revokeObjectURL(link.href);
  link.remove();
}

function previewRosterCsv(input){
  const file = input.files && input.files[0];
  const message = document.getElementById("rosterImportMessage");
  const button = document.getElementById("confirmRosterImport");
  const preview = document.getElementById("rosterImportPreview");
  CoachIQ.rosterImport = [];
  button.disabled = true;
  preview.innerHTML = "";

  if(!file){ return; }
  if(!/\.csv$/i.test(file.name)){
    message.className = "roster-import-message error";
    message.textContent = "Please select a CSV file.";
    return;
  }

  const reader = new FileReader();
  reader.onload = function(event){
    try{
      const rows = parseRosterCsv(event.target.result);
      if(rows.length < 2){
        throw new Error("The CSV must contain a header row and at least one player.");
      }
      if(rows.length - 1 > 500){
        throw new Error("A roster import is limited to 500 players at a time.");
      }

      const headers = rows[0].map(normalizeRosterHeader);
      const indexes = {
        firstName: findRosterHeader(headers, ["firstname", "first", "givenname"]),
        lastName: findRosterHeader(headers, ["lastname", "last", "surname", "familyname"]),
        jersey: findRosterHeader(headers, ["jerseynumber", "jersey", "number", "uniformnumber"]),
        grade: findRosterHeader(headers, ["grade", "class", "year"]),
        team: findRosterHeader(headers, ["team", "level", "squad"]),
        position: findRosterHeader(headers, ["position", "pos"]),
        status: findRosterHeader(headers, ["status", "playerstatus"])
      };

      if(indexes.firstName < 0 || indexes.lastName < 0){
        throw new Error("The CSV needs First Name and Last Name columns. Download the template for the expected format.");
      }

      const roster = rows.slice(1).filter(function(row){
        return row.some(function(value){ return String(value).trim() !== ""; });
      }).map(function(row){
        const value = function(index){ return index < 0 ? "" : String(row[index] || "").trim(); };
        return {
          firstName: value(indexes.firstName),
          lastName: value(indexes.lastName),
          jersey: value(indexes.jersey),
          grade: value(indexes.grade),
          team: value(indexes.team),
          position: value(indexes.position),
          status: value(indexes.status) || "Active"
        };
      });

      const invalidRows = roster.filter(function(player){
        return !player.firstName || !player.lastName;
      });
      if(!roster.length){
        throw new Error("No player rows were found in the CSV.");
      }
      if(invalidRows.length){
        throw new Error(invalidRows.length + " row(s) are missing a first or last name.");
      }

      CoachIQ.rosterImport = roster;
      message.className = "roster-import-message";
      message.textContent = roster.length + " player(s) ready to import. Review the preview, then select Import Players.";
      preview.innerHTML = buildRosterPreview(roster);
      button.disabled = false;
    }catch(error){
      message.className = "roster-import-message error";
      message.textContent = error.message || String(error);
    }
  };
  reader.onerror = function(){
    message.className = "roster-import-message error";
    message.textContent = "The selected CSV could not be read.";
  };
  reader.readAsText(file);
}

function parseRosterCsv(text){
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  for(let i = 0; i < text.length; i++){
    const character = text[i];
    if(character === '"'){
      if(quoted && text[i + 1] === '"'){
        value += '"';
        i += 1;
      }else{
        quoted = !quoted;
      }
    }else if(character === "," && !quoted){
      row.push(value);
      value = "";
    }else if((character === "\n" || character === "\r") && !quoted){
      if(character === "\r" && text[i + 1] === "\n"){ i += 1; }
      row.push(value);
      rows.push(row);
      row = [];
      value = "";
    }else{
      value += character;
    }
  }
  if(quoted){ throw new Error("The CSV contains an unclosed quoted value."); }
  if(value !== "" || row.length){
    row.push(value);
    rows.push(row);
  }
  return rows;
}

function normalizeRosterHeader(value){
  return String(value || "").replace(/^\uFEFF/, "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function findRosterHeader(headers, choices){
  for(let i = 0; i < choices.length; i++){
    const index = headers.indexOf(choices[i]);
    if(index >= 0){ return index; }
  }
  return -1;
}

function buildRosterPreview(roster){
  const escapeHtml = function(value){
    return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  const rows = roster.slice(0, 25).map(function(player){
    return `<tr><td>${escapeHtml(player.firstName)}</td><td>${escapeHtml(player.lastName)}</td>` +
      `<td>${escapeHtml(player.jersey)}</td><td>${escapeHtml(player.grade)}</td>` +
      `<td>${escapeHtml(player.team)}</td><td>${escapeHtml(player.position)}</td>` +
      `<td>${escapeHtml(player.status)}</td></tr>`;
  }).join("");
  const remainder = roster.length > 25
    ? `<p>Showing the first 25 of ${roster.length} players.</p>` : "";
  return remainder + `<table><thead><tr><th>First Name</th><th>Last Name</th><th>#</th>` +
    `<th>Grade</th><th>Team</th><th>Position</th><th>Status</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

function importRoster(){
  if(!CoachIQ.rosterImport.length){ return; }
  const button = document.getElementById("confirmRosterImport");
  const message = document.getElementById("rosterImportMessage");
  button.disabled = true;
  button.textContent = "Importing…";

  google.script.run
    .withSuccessHandler(function(result){
      button.textContent = "Import Players";
      const imported = Number(result.imported || 0);
      const skipped = Number(result.skipped || 0);
      const summary = imported + " new player" + (imported === 1 ? "" : "s") + " imported" +
        (skipped ? "; " + skipped + " duplicate" + (skipped === 1 ? "" : "s") + " skipped" : "") + ".";
      showToast(summary);
      closeRosterImportModal();
      loadPlayers(PageNavigation.requestId);
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      button.textContent = "Import Players";
      message.className = "roster-import-message error";
      message.textContent = error.message || "Unable to import roster.";
    })
    .importPlayers(CoachIQ.rosterImport);
}
function populateTeamFilter(teams){

  const teamFilter = document.getElementById("teamFilter");

  teamFilter.innerHTML = "";

  teamFilter.innerHTML += `
    <option value="All">All Teams</option>
  `;

  teams.forEach(team => {

    teamFilter.innerHTML += `
      <option value="${team}">${team}</option>
    `;

  });

}
function buildOptions(options, selectedValue = ""){

  let html = "";

  const escapeHtml = function(value){
    return String(value == null ? "" : value).replace(/&/g, "&amp;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  options.forEach(function(option){

    const optionText = String(option);

    html += `
      <option value="${escapeHtml(optionText)}"
        ${optionText === String(selectedValue) ? "selected" : ""}>
        ${escapeHtml(optionText)}
      </option>
    `;

  });

  return html;

}

    .withSuccessHandler(function(){

      closePlayerModal();

function archivePlayer(playerId){

    const player = CoachIQ.players.find(p => p[0] === playerId);

    const confirmArchive = confirm(
        `Archive ${player[1]} ${player[2]}?\n\nThis player will be removed from the active roster but all history will be preserved.`
    );

    if (!confirmArchive){
        return;
    }

    google.script.run
        .withSuccessHandler(function(){

            loadPlayers();

        })
        .archivePlayer(playerId);

}

function loadStaff(requestId){
  google.script.run
    .withSuccessHandler(function(settings){
      if(!isCurrentPage("Staff", requestId)){ return; }
      renderStaffDirectory(settings);
    })
    .withFailureHandler(function(error){
      if(!isCurrentPage("Staff", requestId)){ return; }
      console.error(error);
      showToast("Unable to load staff.");
    })
    .getStaffDirectoryData();
}

function renderStaffDirectory(data){
  const staff = data.profiles || [];
  CoachIQ.staffTeams = data.teams || [];
  const directory = document.getElementById("staffDirectory");
  const editor = document.getElementById("staffEditorList");
  const count = document.getElementById("staffCount");
  if(!directory || !editor){ return; }

  directory.innerHTML = "";
  editor.innerHTML = "";
  if(count){ count.textContent = staff.length; }

  if(!staff.length){
    const empty = document.createElement("div");
    empty.className = "staff-empty";
    empty.innerHTML = "<strong>Build your staff directory</strong><p>Add your first coach to make them available in evaluator lists.</p>";
    directory.appendChild(empty);
  }

  staff.forEach(function(profile){
    directory.appendChild(createStaffCard(profile));
    editor.appendChild(createStaffEditorRow(profile));
  });
}

function staffInitials(name){
  return String(name || "")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(function(part){ return part.charAt(0).toUpperCase(); })
    .join("") || "--";
}

function createStaffCard(profile){
  const card = document.createElement("article");
  card.className = "staff-card";

  const avatar = document.createElement("span");
  avatar.className = "staff-avatar";
  avatar.textContent = staffInitials(profile.name);

  const copy = document.createElement("div");
  const heading = document.createElement("h4");
  heading.textContent = profile.name;
  const label = document.createElement("p");
  label.textContent = profile.role + (profile.teams && profile.teams.length ? " • " + profile.teams.join(", ") : " • All teams");
  copy.appendChild(heading);
  copy.appendChild(label);

  const status = document.createElement("span");
  status.className = "staff-active-badge";
  status.textContent = "Active";

  card.appendChild(avatar);
  card.appendChild(copy);
  card.appendChild(status);
  return card;
}

function createStaffEditorRow(profile){
  profile = typeof profile === "string" ? {name:profile} : (profile || {});
  const row = document.createElement("div");
  row.className = "staff-editor-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "staff-name-input";
  input.placeholder = "Coach or staff name";
  input.value = profile.name || "";
  input.addEventListener("input", markStaffUnsaved);

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "staff-remove-button";
  remove.setAttribute("aria-label", "Remove staff member");
  remove.textContent = "\u00d7";
  remove.addEventListener("click", function(){
    row.remove();
    markStaffUnsaved();
  });

  const role = document.createElement("select");
  role.className = "staff-role-input";
  ["Head Coach","Assistant Coach","Position Coach","Analyst","Support Staff"].forEach(function(value){ role.add(new Option(value,value)); });
  role.value = profile.role || "Assistant Coach";
  const email = document.createElement("input"); email.type="email"; email.className="staff-email-input"; email.placeholder="Google account email"; email.value=profile.email || "";
  const access = document.createElement("div"); access.className="staff-access-options";
  access.innerHTML = "<strong>Team access</strong>" + (CoachIQ.staffTeams || []).map(function(team){ return '<label><input type="checkbox" class="staff-team-input" value="'+escapeHtmlValue(team)+'" '+((profile.teams||[]).indexOf(team)>=0?'checked':'')+'> '+escapeHtmlValue(team)+'</label>'; }).join("") +
    "<strong>Capabilities</strong>" + [["manage_roster","Manage roster"],["run_sessions","Run sessions"],["evaluate_players","Evaluate players"],["view_intelligence","View intelligence"],["manage_settings","Manage settings"]].map(function(item){ return '<label><input type="checkbox" class="staff-capability-input" value="'+item[0]+'" '+((profile.capabilities||[]).indexOf(item[0])>=0?'checked':'')+'> '+item[1]+'</label>'; }).join("");
  [role,email].forEach(function(element){ element.addEventListener("change",markStaffUnsaved); });
  access.addEventListener("change",markStaffUnsaved);
  row.dataset.staffId = profile.id || "";
  row.appendChild(input); row.appendChild(role); row.appendChild(email); row.appendChild(access);
  row.appendChild(remove);
  return row;
}

function addStaffMember(){
  const editor = document.getElementById("staffEditorList");
  if(!editor){ return; }
  const row = createStaffEditorRow({name:"",role:"Assistant Coach",teams:[],capabilities:["run_sessions","evaluate_players","view_intelligence"]});
  editor.appendChild(row);
  row.querySelector("input").focus();
  markStaffUnsaved();
}

function markStaffUnsaved(){
  const state = document.getElementById("staffSaveState");
  if(state){
    state.textContent = "Unsaved changes";
    state.classList.add("is-unsaved");
  }
}

function saveStaffDirectory(){
  const button = document.getElementById("saveStaffButton");
  const profiles = Array.from(document.querySelectorAll("#staffEditorList .staff-editor-row")).map(function(row){
    return {id:row.dataset.staffId,name:row.querySelector(".staff-name-input").value.trim(),email:row.querySelector(".staff-email-input").value.trim(),role:row.querySelector(".staff-role-input").value,
      teams:Array.from(row.querySelectorAll(".staff-team-input:checked")).map(function(input){return input.value;}),capabilities:Array.from(row.querySelectorAll(".staff-capability-input:checked")).map(function(input){return input.value;})};
  }).filter(function(profile){return profile.name;});

function applyCoachIQTheme(settings){
  settings = settings || {};
  CoachIQ.programSettings = settings;
  const primary = validThemeColor(settings.primaryColor) ? settings.primaryColor : "#1E3A5F";
  const secondary = validThemeColor(settings.secondaryColor) ? settings.secondaryColor : "#F59E0B";
  const root = document.documentElement;
  root.style.setProperty("--primary", primary);
  root.style.setProperty("--primary-dark", shadeThemeColor(primary, -25));
  root.style.setProperty("--primary-light", shadeThemeColor(primary, 82));
  root.style.setProperty("--secondary", secondary);
  root.style.setProperty("--primary-text", readableThemeText(primary));

  const brand = document.getElementById("programBrandName");
  if(brand){ brand.textContent = settings.programName || "CoachIQ"; }
  const logo = document.getElementById("programLogo");
  if(logo){
    const requestedLogoUrl = String(settings.logoUrl || "").trim();
    const logoUrl = requestedLogoUrl.toLowerCase().indexOf("https://") === 0
      ? requestedLogoUrl
      : "";
    logo.hidden = !logoUrl;
    if(logoUrl){ logo.src = logoUrl; }
  }
  updatePointTerminology();
}

function validThemeColor(value){
  return /^#[0-9a-f]{6}$/i.test(String(value || ""));
}

function readableThemeText(hex){
  const value = parseInt(hex.slice(1), 16);
  const red = value >> 16;
  const green = (value >> 8) & 255;
  const blue = value & 255;
  return (red * 299 + green * 587 + blue * 114) / 1000 >= 145 ? "#111827" : "#FFFFFF";
}

function shadeThemeColor(hex, percent){
  const value = parseInt(hex.slice(1), 16);
  const target = percent < 0 ? 0 : 255;
  const amount = Math.abs(percent) / 100;
  const channel = function(shift){
    const current = (value >> shift) & 255;
    return Math.round(current + (target - current) * amount).toString(16).padStart(2, "0");
  };
  return "#" + channel(16) + channel(8) + channel(0);
}

function initializeRatingButtons(){

    document.querySelectorAll(".rating-group").forEach(function(group){

        group.querySelectorAll(".rating-btn").forEach(function(button){

            button.addEventListener("click", function(){

                if(group.dataset.saving === "true"){
                    return;
                }

                const previousButton = group.querySelector(".rating-btn.selected");

                // Update button color
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                // Read button data
                const sessionId = button.dataset.session;
                const playerId = button.dataset.player;
                const category = button.dataset.category;
                const score = Number(button.dataset.score);

                group.dataset.saving = "true";
                group.querySelectorAll(".rating-btn").forEach(function(btn){
                    btn.disabled = true;
                });
                retryEvaluationSave();

                // Save to Google Sheets
                google.script.run
                    .withSuccessHandler(function(){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                        });
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        group.dataset.saving = "false";
                        group.querySelectorAll(".rating-btn").forEach(function(btn){
                            btn.disabled = false;
                            btn.classList.remove("selected");
                        });
                        if(previousButton){
                            previousButton.classList.add("selected");
                        }
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save score.");
                    })
                    .updateEvaluationScore(
                        sessionId,
                        playerId,
                        category,
                        score
                    );

            });

        });

    });

}
function initializeAttendanceCheckboxes(){

    document
        .querySelectorAll(".attendance-check")
        .forEach(function(box){

            box.addEventListener("change", function(){

                const row = box.closest(".evaluation-row");

                const sessionId = window.currentPracticeSession;

                const playerId = row.dataset.player;

                const buttons = row.querySelectorAll(".rating-btn");
                const newValue = box.checked;

                box.disabled = true;
                retryEvaluationSave();

                if(box.checked){

                    row.classList.remove("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = false;
                    });

                }else{

                    row.classList.add("player-absent");

                    buttons.forEach(function(btn){
                        btn.disabled = true;
                    });

                }

                google.script.run
                    .withSuccessHandler(function(){
                        box.disabled = false;
                        endEvaluationSave(true);
                    })
                    .withFailureHandler(function(error){
                        box.checked = !newValue;
                        box.disabled = false;
                        row.classList.toggle("player-absent", !box.checked);
                        buttons.forEach(function(btn){
                            btn.disabled = !box.checked;
                        });
                        endEvaluationSave(false);
                        showToast(error.message || "Unable to save attendance.");
                    })
                    .updateAttendance(
                        sessionId,
                        playerId,
                        newValue
                    );

            });

        });

}

console.log("Attendance:", playerScores.Attendance);
console.log("Type:", typeof playerScores.Attendance);
console.log(playerScores);

        `.evaluation-row[data-player="${playerId}"]`
      );

        const checkbox = row.querySelector(".attendance-check");

        checkbox.checked = false;

        row.classList.add("player-absent");

        row.querySelectorAll(".rating-btn").forEach(function(btn){
          btn.disabled = true;

      }

    }

    // -------------------------
    // Restore Ratings
    // -------------------------

    Object.keys(playerScores).forEach(function(category){

  if(category === "Attendance"){
    return;
  }

  if(category === "Reward"){

    const dropdown = document.querySelector(
      `.reward-select[data-player="${playerId}"]`
    );

    if(dropdown){
      let rewardId = playerScores.Reward || "";

      if(rewardId && !Array.from(dropdown.options).some(function(option){
        return option.value === rewardId;
      })){
        const legacyReward = (window.pointRewards || []).find(function(reward){
          return reward["Reward Name"] === rewardId;
        });
        rewardId = legacyReward ? legacyReward["Reward ID"] : "";
      }

      dropdown.value = rewardId;
      dropdown.dataset.savedValue = rewardId;
      const indicator = document.querySelector(
        `.reward-indicator[data-player="${playerId}"]`
      );
      if(indicator){ indicator.hidden = !rewardId; }
    }

    return;

  }

  if(category === "Notes"){
    const preview = document.querySelector(
      `.evaluation-note-preview[data-player="${playerId}"]`
    );
    if(preview){
      preview.textContent = playerScores.Notes || "No note saved.";
      preview.title = playerScores.Notes || "";
    }
    const indicator = document.querySelector(
      `.note-indicator[data-player="${playerId}"]`
    );
    if(indicator){ indicator.hidden = !playerScores.Notes; }
    return;
  }

  const score = playerScores[category];

      if(score === "" || score == null){
        return;
      }

      const button = document.querySelector(
        `.rating-btn[data-player="${playerId}"][data-category="${category}"][data-score="${score}"]`
      );

      if(button){

        button.classList.add("selected");

      }

    });

  });

  const teams = Array.from(new Set(players.map(function(player){
    return player.team;
  }).filter(Boolean))).sort();
  select.innerHTML = '<option value="">All Teams</option>' +
    teams.map(function(team){

    }).join("");

function filterLeaderboard(){
  const searchElement = document.getElementById("leaderboardSearch");
  const teamElement = document.getElementById("leaderboardTeam");

  const team = teamElement ? teamElement.value : "";

    const fullName = (player.firstName + " " + player.lastName).toLowerCase();
    return (!search || fullName.includes(search)) &&
      (!team || player.team === team);

  showLeaderboard(players);

function downloadLeaderboardPdf(button){
  const originalText = button.textContent;
  const options = {
    search: document.getElementById("leaderboardSearch").value.trim(),
    team: document.getElementById("leaderboardTeam").value
  };
  button.disabled = true;
  button.textContent = "Building PDF…";
  google.script.run
    .withSuccessHandler(function(report){
      const link = document.createElement("a");
      link.href = "data:application/pdf;base64," + report.base64;
      link.download = report.fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      button.disabled = false;
      button.textContent = originalText;
    })
    .withFailureHandler(function(error){
      button.disabled = false;
      button.textContent = originalText;
      showToast(error.message || "Unable to build leaderboard PDF.");
    })
    .getLeaderboardPdf(options);
}
function savePointRewards(){

  const rewards = [];

  document.querySelectorAll(".reward-row").forEach(function(row,index){

    const name = row.querySelector(".reward-name").value.trim();

    const points = Number(
      row.querySelector(".reward-points").value
    );

    const active =
      row.querySelector(".reward-active").checked;

    if(name === ""){
      return;
    }

    rewards.push({

      id: row.dataset.rewardId || "",

      name: name,

      points: points,

      active: active,

      order: index + 1

    });

  });

  google.script.run
    .withSuccessHandler(function(){

      showToast("Point Rewards Saved!");

      loadSettings(PageNavigation.requestId);

    })
    .withFailureHandler(function(error){
      console.error(error);
      const message = error && error.message
        ? error.message
        : String(error || "Unknown error");
      showToast("Unable to save rewards: " + message);
    })
    .savePointRewards(rewards);

}
function populateRewardDropdowns(rewards){

console.log(rewards);

    document
        .querySelectorAll(".reward-select")
        .forEach(function(select){

            select.innerHTML = "";

            const blank = document.createElement("option");
            blank.value = "";

            rewards.forEach(function(reward){

option.textContent =

}
function initializeRewardDropdowns(){

    document
        .querySelectorAll(".reward-select")
        .forEach(function(select){

            select.dataset.savedValue = select.value || "";

            select.addEventListener("change", function(){

                const playerId = select.dataset.player;
                const previousValue = select.dataset.savedValue || "";

                select.disabled = true;
                retryEvaluationSave();

                google.script.run
                .withSuccessHandler(function(){

                    select.dataset.savedValue = select.value;
                    const indicator = document.querySelector(
                      `.reward-indicator[data-player="${playerId}"]`
                    );
                    if(indicator){ indicator.hidden = !select.value; }
                    select.disabled = false;
                    endEvaluationSave(true);
                    showToast(select.value ? "Reward saved!" : "Reward cleared!");

                })
                .withFailureHandler(function(error){

                    console.error(error);
                    select.value = previousValue;
                    select.disabled = false;
                    endEvaluationSave(false);
                    showToast("Unable to save reward.");

                })
                .updateReward(
                    window.currentPracticeSession,
                    playerId,
                    select.value
                );

            });

        });

}

function populateSessionSummary(session){

    const sessionType = document.getElementById("summarySessionType");
    const date = document.getElementById("summaryDate");
    const teams = document.getElementById("summaryTeams");
    const evaluator = document.getElementById("summaryEvaluator");
    const status = document.getElementById("summaryStatus");
    const notes = document.getElementById("summaryNotes");
    const notesText = document.getElementById("summaryNotesText");

    if(sessionType)
        sessionType.innerText = session["Session Type"];

    if(date)
        date.innerText = "📅 " + session["Date"];

    if(teams)
        teams.innerText = "👥 " + session["Teams"];

    if(evaluator)
        evaluator.innerText = "👤 " + session["Evaluators"];

    if(status)
        status.innerText = session["Status"];

    if(notes){

        if(session["Session Notes"]){

            notes.style.display = "block";

            if(notesText){
                notesText.innerText = session["Session Notes"];
            }

        }else{

            notes.style.display = "none";

        }

    }

}
