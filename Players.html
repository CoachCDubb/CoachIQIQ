<section>

<div class="page-header">

    <div>

        <h2>Players</h2>

        <p class="page-subtitle">
            Manage your roster and player information.
        </p>

    </div>

    <div class="player-page-actions">
        <button
            class="btn-v2 btn-secondary-v2 btn-lg-v2"
            onclick="openRosterImportModal()">
            Import Roster
        </button>

        <button
            class="btn-v2 btn-primary-v2 btn-lg-v2"
            onclick="openAddPlayerModal()">
            + Add Player
        </button>
    </div>

</div>

</div>

<div class="search-bar">

    <input
    type="text"
    id="playerSearch"
    placeholder="Search players..."
    onkeyup="searchPlayers()"
>

</div>
<div class="filter-bar">

    <select id="teamFilter" onchange="filterPlayers()">
        <option value="All">All Teams</option>
        <option value="Varsity">Varsity</option>
        <option value="JV">JV</option>
        <option value="Freshman">Freshman</option>
    </select>

    <select id="gradeFilter" onchange="filterPlayers()">
        <option value="All">All Grades</option>
        <option value="9">9th</option>
        <option value="10">10th</option>
        <option value="11">11th</option>
        <option value="12">12th</option>
    </select>

    <select id="statusFilter" onchange="filterPlayers()">
        <option value="All">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>

</div>

<table id="playersTable">
<thead>

    <tr>

        <th>ID</th>
        <th>Name</th>
        <th>#</th>
        <th>Grade</th>
        <th>Team</th>
        <th>Actions</th>

    </tr>

</thead>

    <tbody>

</tbody>

</table>

<div id="rosterImportModal" class="modal" style="display:none;">
    <div class="modal-content roster-import-modal">
        <div class="roster-import-heading">
            <div>
                <h2>Import Roster</h2>
                <p>Upload a CSV file to add multiple players at once.</p>
            </div>
            <button class="modal-close" onclick="closeRosterImportModal()">×</button>
        </div>

        <div class="roster-import-instructions">
            Required columns: <strong>First Name</strong> and <strong>Last Name</strong>.<br>
            Optional columns: Jersey Number, Grade, Team, Position, and Status.
        </div>

        <div class="roster-import-actions">
            <input id="rosterCsvFile" type="file" accept=".csv,text/csv" onchange="previewRosterCsv(this)">
            <button class="btn" onclick="downloadRosterTemplate()">Download CSV Template</button>
        </div>

        <div id="rosterImportMessage" class="roster-import-message"></div>
        <div id="rosterImportPreview" class="roster-import-preview"></div>

        <div class="form-actions">
            <button class="btn" onclick="closeRosterImportModal()">Cancel</button>
            <button id="confirmRosterImport" class="btn btn-primary" onclick="importRoster()" disabled>
                Import Players
            </button>
        </div>
    </div>
</div>


</section>
