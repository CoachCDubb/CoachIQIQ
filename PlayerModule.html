function renderPlayers(players){

  const tbody = document.querySelector("#playersTable tbody");

  tbody.innerHTML = "";

  players.forEach(function(player){

    tbody.innerHTML += `
      <tr>

        <td>${player[0]}</td>

        <td>${player[1]} ${player[2]}</td>

        <td>${player[3]}</td>

        <td>${player[4]}</td>

        <td>${player[5]}</td>

        <td class="action-cell">

          <button
            class="action-btn view-btn"
            onclick="openPlayerModal('${player[0]}', false)">
            👁
          </button>

          <button
            class="action-btn edit-btn"
            onclick="openPlayerModal('${player[0]}', true)">
            ✏️
          </button>

          <button
            class="action-btn delete-btn"
            onclick="archivePlayer('${player[0]}')">
            📦
          </button>

        </td>

      </tr>
    `;

  });

}

function searchPlayers(){

  filterPlayers();

}

function filterPlayers(){

  const search =
    document
      .getElementById("playerSearch")
      .value
      .toLowerCase();

  const team =
    document.getElementById("teamFilter").value;

  const grade =
    document.getElementById("gradeFilter").value;

  const status =
    document.getElementById("statusFilter").value;

  const filtered = CoachIQ.players.filter(function(player){

    const matchesSearch =
      player.some(value =>
        String(value).toLowerCase().includes(search)
      );

    const matchesTeam =
      team === "All" ||
      player[5] === team;

    const matchesGrade =
      grade === "All" ||
      String(player[4]) === grade;

    const matchesStatus =
      status === "All" ||
      player[7] === status;

    return (
      matchesSearch &&
      matchesTeam &&
      matchesGrade &&
      matchesStatus
    );

  });

  renderPlayers(filtered);

}

function openPlayerModal(playerId, editMode){

  if(editMode){
    openEditPlayer(playerId);
    return;
  }

  document.getElementById("playerModalTitle").textContent =
    "Player Profile";

  document.getElementById("playerProfileContent").innerHTML = `
    <div style="padding:40px;text-align:center;">
      Loading Player...
    </div>
  `;

  document.getElementById("playerModal").style.display = "block";

  google.script.run

    .withSuccessHandler(function(result){

      try{

        if(!result || result.ok !== true || !result.profile){
          throw new Error("The server returned an empty player profile response.");
        }

        renderPlayerProfile(result.profile);

      }catch(err){

        console.error(err);
        showPlayerProfileError(err.message || "Unable to render player profile.");

      }

    })

    .withFailureHandler(function(error){

      console.error(error);
      const message = error && error.message
        ? error.message
        : "Unknown error";
      showPlayerProfileError(message);

    })

    .getPlayerProfileForUI(playerId);

}

function showPlayerProfileError(message){

  const content = document.getElementById("playerProfileContent");
  content.innerHTML = "";

  const errorContainer = document.createElement("div");
  errorContainer.style.padding = "30px";

  const title = document.createElement("strong");
  title.textContent = "Unable to load player profile.";

  const details = document.createElement("div");
  details.style.marginTop = "10px";
  details.style.color = "#b42318";
  details.textContent = message;

  errorContainer.appendChild(title);
  errorContainer.appendChild(details);
  content.appendChild(errorContainer);

}

function closePlayerModal(){

function getStars(score){

  score = Number(score);

  let stars = "";

  for(let i = 1; i <= 5; i++){

    stars += i <= Math.round(score)
      ? "⭐"
      : "☆";

  }

  return stars;

}

function renderPantherPointHistory(history){

    if(!history || history.length === 0){

        return `
            <div style="text-align:center;padding:25px;color:#777;">
                No Panther Point history.
            </div>
        `;

    }

    let html = "";

    history.forEach(function(point){

        const positive = Number(point.Points) >= 0;

        html += `

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            padding:15px 0;
            border-bottom:1px solid #eee;
        ">

            <div>

                <div style="
                    font-weight:bold;
                    font-size:16px;
                ">
                    ${point["Category Name"]}
                </div>

                <div style="
                    color:#666;
                    margin-top:4px;
                ">
                    ${point.Notes || ""}
                </div>

                <div style="
                    color:#999;
                    font-size:12px;
                    margin-top:6px;
                ">
                    ${new Date(point.Date).toLocaleDateString()}
                    •
                    ${point.Coach}
                </div>

            </div>

            <div style="
                font-size:22px;
                font-weight:bold;
                color:${positive ? "#22C55E" : "#EF4444"};
            ">

                ${positive ? "+" : ""}
                ${point.Points}

            </div>

        </div>

        `;

    });

    return html;

}

const content = document.getElementById("practiceHistoryContent");
const modal = document.getElementById("practiceHistoryModal");

if(!content || !modal){
    showToast("Unable to open practice history.");
    return;
}

content.innerHTML = html || `
  <div style="padding:20px;text-align:center;">
    No practice history is available.
  </div>`;

modal.style.display = "block";

modal.style.background = "rgba(0,0,0,.65)";

}

function closePracticeHistory(){

    document.getElementById("practiceHistoryModal").style.display = "none";

}

function downloadPlayerReport(playerId, button){

    const originalHtml = button.innerHTML;
    button.disabled = true;
    button.innerHTML = "<span aria-hidden=\"true\">⏳</span><span>Building PDF…</span>";

    google.script.run
      .withSuccessHandler(function(report){
        const link = document.createElement("a");
        link.href = "data:application/pdf;base64," + report.base64;
        link.download = report.fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        button.disabled = false;
        button.innerHTML = originalHtml;
      })
      .withFailureHandler(function(error){
        button.disabled = false;
        button.innerHTML = originalHtml;
        showToast(error.message || "Unable to build player report.");
      })
      .getPlayerReportPdf(playerId);

}
function getTimelineIcon(category){

    switch(category){

        case "Note":
            return "📝";

        case "Award":
            return "🏆";

        case "Attendance":
            return "📅";

        case "Evaluation":
            return "📈";

        case "Academic":
            return "🎓";

        case "Injury":
            return "🏥";

        default:
            return "📌";

    }

}
