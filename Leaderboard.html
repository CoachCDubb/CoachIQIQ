<section>

    <div class="page-header">

        <div>
            <h2>🏆 Panther Leaderboard</h2>
            <p>Recognizing the players who consistently build our culture.</p>
        </div>

        <button class="btn btn-primary" onclick="downloadLeaderboardPdf(this)">
            Download PDF
        </button>

    </div>

    <div class="card">

        <div class="leaderboard-toolbar">

            <input
                id="leaderboardSearch"
                class="input"
                placeholder="Search player..."
                oninput="filterLeaderboard()">

            <select
                id="leaderboardTeam"
                class="input"
                onchange="filterLeaderboard()">

                <option value="">All Teams</option>

            </select>

        </div>

        <div id="leaderboardContent">

            Loading Leaderboard...

        </div>

    </div>

</section>
