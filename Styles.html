<style>

:root{

  /* ===========================
     COLORS
  =========================== */

  --primary:#1F4E8C;
  --primary-dark:#173B69;
  --primary-light:#E8F0FB;
  --primary-text:#FFFFFF;
  --secondary:#F59E0B;

  --background:#F5F7FA;
  --surface:#FFFFFF;

  --text:#1F2937;
  --muted:#6B7280;

  --border:#E5E7EB;

  --success:#16A34A;
  --warning:#F59E0B;
  --danger:#DC2626;

  /* ===========================
     RADIUS
  =========================== */

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --radius-xl:24px;

  /* ===========================
     SHADOWS
  =========================== */

  --shadow-sm:0 2px 6px rgba(0,0,0,.05);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 28px rgba(0,0,0,.15);

  /* ===========================
     SPACING
  =========================== */

  --space-xs:6px;
  --space-sm:12px;
  --space-md:20px;
  --space-lg:30px;

  /* ===========================
     TRANSITIONS
  =========================== */

  --transition:.20s ease;

}

/* ---------- Reset ---------- */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:var(--background);
  color:var(--text);
}

/* ---------- Layout ---------- */

#app{
  display:flex;
  height:100vh;
}

#app[hidden]{display:none;}

#sidebar{
  width:260px;
  background:var(--primary);
  color:var(--primary-text);
  padding:24px;
}

.program-logo{
  display:block;
  width:64px;
  height:64px;
  object-fit:contain;
  margin-bottom:10px;
  border-radius:12px;
  background:rgba(255,255,255,.9);
}

.onboarding-overlay[hidden]{display:none;}

.onboarding-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  overflow:auto;
  padding:36px 18px;
  background:linear-gradient(135deg, var(--primary), var(--primary-dark));
}

.onboarding-shell{
  width:min(980px, 100%);
  margin:0 auto;
  padding:32px;
  border-radius:24px;
  background:#fff;
  box-shadow:0 24px 70px rgba(0,0,0,.28);
}

.onboarding-brand{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:28px;
}

.onboarding-mark{
  display:grid;
  place-items:center;
  width:64px;
  height:64px;
  border-radius:18px;
  color:var(--primary-text);
  background:var(--primary);
  font-weight:800;
}

.onboarding-shell h3{
  margin:28px 0 14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.onboarding-feature-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 24px}.onboarding-feature-map div{display:grid;gap:4px;padding:12px;border:1px solid var(--border);border-left:4px solid var(--secondary);background:#f8fafc}.onboarding-feature-map strong{font-size:12px}.onboarding-feature-map span{color:var(--muted);font-size:10px;line-height:1.4}

.onboarding-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:16px;
}

.onboarding-grid label,
.onboarding-rewards label{
  display:flex;
  flex-direction:column;
  gap:7px;
  color:var(--text);
  font-weight:600;
}

.onboarding-grid input,
.onboarding-grid select,
.onboarding-grid textarea,
.onboarding-rewards input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font:inherit;
  font-weight:400;
  background:#fff;
}

.onboarding-grid textarea{min-height:86px;resize:vertical;}
.onboarding-wide{grid-column:1 / -1;}
.onboarding-theme-controls input[type="color"]{height:48px;padding:5px;}
.onboarding-optional{font-size:13px;color:var(--muted);font-weight:400;}

.onboarding-rewards{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:12px;
}

.onboarding-rewards label{
  display:grid;
  grid-template-columns:1fr 80px;
}

.onboarding-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:28px;
  color:var(--muted);
}

.onboarding-message{
  margin-top:16px;
  color:var(--danger);
  white-space:pre-line;
}

@media(max-width:700px){
  .onboarding-grid,
  .onboarding-rewards{grid-template-columns:1fr;}
  .onboarding-wide{grid-column:auto;}
  .onboarding-shell{padding:22px;}
}

#content{
  flex:1;
  padding:30px;
  overflow:auto;
}

/* ---------- Header ---------- */

#header{
  margin-bottom:30px;
}

#header h1{
  font-size:34px;
}

#header p{
  color:var(--muted);
  margin-top:6px;
}

/* ---------- Cards ---------- */

.card{

  background:white;

  border:1px solid var(--border);

  border-radius:var(--radius);

  padding:24px;

  box-shadow:0 4px 12px rgba(0,0,0,.05);

}


/* ---------- Buttons ---------- */

.btn{
  display:inline-block;
  padding:10px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  margin-top:15px;
}

.btn-primary{
  background:var(--primary);
  color:var(--primary-text);
}

.btn-primary:hover{
  background:var(--primary-dark);
}

/* ---------- Card Titles ---------- */

.card h2{
  font-size:20px;
  margin-bottom:16px;
}

.card p{
  color:var(--muted);
  line-height:1.6;
}
/* ---------- Tables ---------- */

table{

    width:max-content;
    min-width:100%;

    border-collapse:separate;
    border-spacing:0;

    background:white;

    margin-top:20px;

}

thead{
    background:#F3F4F6;
}

th{

    padding:14px 18px;

    text-align:left;

    white-space:nowrap;

    background:#F3F4F6;

    border-bottom:1px solid var(--border);

}

td{

    padding:14px 18px;

    white-space:nowrap;

    border-bottom:1px solid #F3F4F6;

    background:white;

}

.evaluation-table-wrapper{

    width:100%;
    overflow-x:auto;
    overflow-y:auto;

    max-height:70vh;

    position:relative;

}

.sticky-attendance{
    position:sticky;
    left:0;
    background:white;
    z-index:20;
}

.sticky-player{
    position:sticky;
    left:70px;
    background:white;
    z-index:19;
}

thead .sticky-attendance,
thead .sticky-player{
    background:#F3F4F6;
}
tbody tr:hover{
    background:#F9FAFB;
}
/* ---------- Sidebar ---------- */

.logo{
    margin-bottom:35px;
}

.logo h2{
    margin:0;
    font-size:24px;
}

.logo p{
    margin-top:6px;
    opacity:.75;
    font-size:13px;
}

.nav-item{
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:6px;
    transition:all .2s ease;
    font-weight:500;
}

.nav-item:hover{
    background:rgba(255,255,255,.12);
    transform:translateX(4px);
}

.nav-item.active{
    background:#ffffff;
    color:var(--primary);
    font-weight:700;
}
/* ---------- Player Search ---------- */

.search-bar{
    margin:20px 0;
}

.search-bar input{
    width:100%;
    padding:12px 16px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.2s;
    box-sizing:border-box;
}

.search-bar input:focus{
    border-color:#174EA6;
}
/* ---------- Player Filters ---------- */

.filter-bar{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.filter-bar select{
    padding:10px 14px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    font-size:14px;
    min-width:160px;
    outline:none;
    background:#fff;
}

.program-logo[hidden]{display:none;}

.filter-bar select:focus{
    border-color:#174EA6;
}
/* ---------- Action Buttons ---------- */

.action-cell{
    display:flex;
    justify-content:center;
    gap:6px;
}

.action-btn{
    border:none;
    background:#f5f5f5;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    font-size:15px;
    transition:all .2s ease;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.view-btn:hover{
    background:#DBEAFE;
}

.edit-btn:hover{
    background:#FEF3C7;
}

.delete-btn:hover{
    background:#FEE2E2;
}
/* ---------- Modal ---------- */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
}

.modal-content{

    background:#fff;

    width:95%;

    max-width:1400px;

    max-height:92vh;

    overflow-y:auto;

    margin:20px auto;

    border-radius:20px;

    padding:35px;

    box-shadow:0 20px 60px rgba(0,0,0,.28);

}

.close-modal{
    float:right;
    font-size:30px;
    cursor:pointer;
    font-weight:bold;
}

.close-modal:hover{
    color:#174EA6;
}
/* ---------- Player Profile ---------- */

.player-header{
    text-align:center;
    margin-bottom:30px;
}

.player-header h2{
    margin:0;
    font-size:28px;
    color:var(--text);
}

.player-header p{
    margin-top:8px;
    color:var(--muted);
    font-size:16px;
    font-weight:600;
}

.player-info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.info-card{
    background:#F8FAFC;
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.info-card strong{
    display:block;
    margin-bottom:8px;
    color:var(--primary);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.5px;
}
.player-avatar{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#E5E7EB;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;
}
/* ---------- Edit Player Form ---------- */

.edit-form{
    max-width:650px;
    margin:0 auto;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.edit-form label{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    margin-bottom:4px;
}

.edit-form input,
.edit-form select{

    width:100%;

    padding:12px 14px;

    border:1px solid var(--border);

    border-radius:10px;

    font-size:15px;

    background:white;

    transition:.2s;
}

.edit-form input:focus,
.edit-form select:focus{

    outline:none;

    border-color:var(--primary);

}

.edit-form input:disabled{

    background:#F3F4F6;

    color:#6B7280;

}

.edit-form .btn{

    margin-top:12px;

    width:220px;

    align-self:flex-start;

}
/* ---------- Form Layout ---------- */

.form-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

.form-field{

    display:flex;

    flex-direction:column;

}
.form-field label{
    margin-bottom:8px;
    font-size:13px;
    font-weight:600;
    color:var(--text);
}

.form-actions{
    display:flex;
    justify-content:center;
    margin-top:35px;
}

.form-actions .btn{
    width:260px;
    padding:14px 24px;
    font-size:16px;
    font-weight:600;
}
/* ---------- Players Toolbar ---------- */

.players-toolbar{

    display:flex;

    justify-content:flex-start;

    margin-bottom:24px;

}

/* ---------- Primary Action Button ---------- */

.btn-large{

    padding:12px 26px;

    font-size:16px;

    font-weight:700;

    min-width:170px;

}
/* ---------- Settings ---------- */

.setting-item{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:12px;

}

.setting-input{

    flex:1;

    width:100%;

    padding:12px 14px;

    border:1px solid var(--border);

    border-radius:10px;

    font-size:15px;

    background:white;

    transition:.2s;

}

.setting-input:focus{

    outline:none;

    border-color:var(--primary);

}

.delete-setting-btn{

    width:42px;

    height:42px;

    border:none;

    border-radius:10px;

    background:#FEE2E2;

    cursor:pointer;

    font-size:18px;

    transition:.2s;

}

.delete-setting-btn:hover{

    background:#FECACA;

}
/* ---------- Toast Notification ---------- */

.toast{

    position:fixed;

    bottom:30px;

    right:30px;

    background:var(--success);

    color:white;

    padding:14px 22px;

    border-radius:12px;

    font-size:15px;

    font-weight:600;

    box-shadow:0 8px 24px rgba(0,0,0,.18);

    opacity:0;

    transform:translateY(20px);

    transition:all .25s ease;

    pointer-events:none;

    z-index:99999;

}

.toast.show{

    opacity:1;

    transform:translateY(0);

}
/* ---------- Evaluation Rating ---------- */

.rating-group{

    display:flex;

    justify-content:center;

    gap:8px;

}

.rating-btn{

    width:34px;

    height:34px;

    border:2px solid #D1D5DB;

    border-radius:50%;

    background:white;

    color:#6B7280;

    font-weight:700;

    font-size:14px;

    cursor:pointer;

    transition:.15s;

}

.rating-btn:hover{

    border-color:var(--primary);

    transform:scale(1.08);

}

.rating-btn.selected{

    background:var(--primary);

    color:var(--primary-text);

    border-color:var(--primary);

}
.player-absent{

    opacity: .25;

    background-color: #f5f5f5;

    transition: all .2s ease;

}
.player-absent .rating-btn:disabled{

    cursor: not-allowed;

    opacity: .35;

}
.absent-badge{

    display: none;

    margin-left: 10px;

    padding: 3px 8px;

    border-radius: 20px;

    background: #DC2626;

    color: white;

    font-size: 11px;

    font-weight: 600;

}
.player-absent .absent-badge{

    display: inline-block;

}
.status-pill{

  display:inline-block;

  padding:6px 14px;

  border-radius:20px;

  font-size:13px;

  font-weight:600;

  color:white;

  background:#2E7D32;

}

.status-completed{

  background:#1565C0;

}

.status-progress{

  background:#2E7D32;

}
/* ===========================
   Dashboard
=========================== */

.dashboard-header{

    margin-bottom:30px;

}

.dashboard-header h2{

    margin:0;

    font-size:34px;

    font-weight:800;

}

.dashboard-header p{

    margin-top:8px;

    color:#6B7280;

    font-size:16px;

}
.dashboard-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;

}

.dashboard-card{

    min-height:180px;

    padding:28px;

    border-radius:18px;

    background:#ffffff;

    border:1px solid #e5e7eb;

    box-shadow:0 8px 24px rgba(0,0,0,.06);

    transition:all .25s ease;

}

.dashboard-card:hover{

    transform:translateY(-4px);

    box-shadow:0 14px 30px rgba(0,0,0,.10);

}

.dashboard-number{

    margin-top:18px;

    font-size:52px;

    font-weight:800;

    color:#111827;

    line-height:1;

    letter-spacing:-1px;

}
.dashboard-card h3{

    margin:0;

    font-size:15px;

    font-weight:600;

    color:#6B7280;

    text-transform:uppercase;

    letter-spacing:.08em;

}
.dashboard-label{

    margin-top:12px;

    color:#6B7280;

    font-size:14px;

}
.player-profile-header{

    text-align:center;

    margin-bottom:25px;

}

.player-profile-header h2{

    margin:0;

    font-size:30px;

}

.player-profile-hero-actions{
    display:flex;
    align-items:center;
    gap:22px;
    flex:0 0 auto;
    margin-left:24px;
}

.profile-pdf-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:44px;
    padding:11px 18px;
    border:1px solid rgba(255,255,255,.42);
    border-radius:11px;
    color:#111827;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
}

.profile-pdf-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 7px 16px rgba(0,0,0,.24);
}

.profile-pdf-btn:disabled{
    opacity:.7;
    cursor:wait;
    transform:none;
}

.player-profile-jersey-mark{
    font-size:90px;
    opacity:.08;
    font-weight:900;
    line-height:1;
}

@media(max-width:850px){
    .player-profile-hero-header{
        align-items:flex-start !important;
        flex-direction:column;
        gap:20px;
    }
    .player-profile-hero-actions{
        width:100%;
        margin-left:0;
        justify-content:space-between;
    }
    .player-profile-jersey-mark{font-size:58px;}
}

.player-subtitle{

    color:#777;

    margin-top:8px;

    font-size:15px;

}

.profile-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:12px;

    padding:20px;

    margin-bottom:18px;

}

.attendance-percent{

    font-size:40px;

    font-weight:bold;

    color:var(--primary);

}

.pillar-table{

    width:100%;

    border-collapse:collapse;

}

.pillar-table td{

    padding:10px;

    border-bottom:1px solid #eee;

}

.pillar-table td:last-child{

    text-align:right;

    font-weight:bold;

}
/* ===========================
   Recent Activity Timeline
=========================== */

.timeline-item{

    padding:16px 0;

    border-bottom:1px solid #ECECEC;

}

.timeline-item:last-child{

    border-bottom:none;

}

.timeline-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;

}

.timeline-header strong{

    font-size:15px;

    color:#1F2937;

}

.timeline-date{

    color:#9CA3AF;

    font-size:13px;

}

.timeline-details{

    color:#4B5563;

    line-height:1.5;

    margin-bottom:8px;

}

.timeline-coach{

    font-size:12px;

    color:#9CA3AF;

    font-style:italic;

}
/* ============================
   Player Profile Cards
============================ */

.profile-card{
    background:white;
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.2s ease;
}

.profile-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.profile-card h2{
    margin:10px 0;
    font-size:30px;
    color:#111827;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    background:#111827;
    color:white;
    font-size:13px;
    font-weight:bold;
}
/* ======================================
   Leaderboard
====================================== */

.leaderboard-card{

    background:white;

    border-radius:18px;

    padding:22px;

    margin-bottom:18px;

    box-shadow:0 6px 18px rgba(0,0,0,.08);

    transition:.25s;

    cursor:pointer;

}

.leaderboard-toolbar{
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.leaderboard-toolbar .input{
    min-height:42px;
    width:100%;
    max-width:320px;
    padding:10px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:white;
}

.leaderboard-empty{
    padding:50px 20px;
    text-align:center;
    color:#6b7280;
    background:#f9fafb;
    border-radius:14px;
}

.reward-select{
    min-width:150px;
}

.evaluation-note-preview{
    display:block;
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#64748b;
    font-size:12px;
    margin-bottom:4px;
}

.evaluation-row-indicators{
    display:inline-flex;
    gap:4px;
    margin-left:6px;
}

.evaluation-details-row[hidden]{
    display:none;
}

.evaluation-details-row td{
    background:#f8fafc;
    padding:14px 18px;
}

.evaluation-details-panel{
    display:flex;
    align-items:flex-end;
    gap:24px;
    padding-left:70px;
}

.evaluation-details-panel label,
.evaluation-note-control{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.evaluation-note-control{
    min-width:220px;
}

.player-page-actions,
.roster-import-actions,
.roster-import-heading{
    display:flex;
    align-items:center;
    gap:12px;
}

.roster-import-heading{
    justify-content:space-between;
}

.roster-import-modal{
    width:min(900px, 92vw);
    max-width:900px;
}

.roster-import-instructions,
.roster-import-message{
    margin:16px 0;
    padding:14px;
    border-radius:10px;
    background:#f3f4f6;
    line-height:1.5;
}

.roster-import-message.error{
    color:#991b1b;
    background:#fee2e2;
    white-space:pre-line;
}

.roster-import-preview{
    overflow:auto;
    max-height:320px;
    margin:16px 0;
}

.roster-import-preview table{
    min-width:720px;
}
.roster-file-drop{position:relative;display:flex;align-items:center;gap:14px;margin:18px 0;padding:18px;border:2px dashed color-mix(in srgb,var(--primary) 35%,var(--border));border-radius:4px;background:color-mix(in srgb,var(--primary) 4%,white);cursor:pointer;}
.roster-file-drop:hover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 7%,white);}
.roster-file-drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.roster-file-drop>span:nth-child(2){display:flex;flex-direction:column;gap:3px;}
.roster-file-drop strong{color:var(--ink);font-size:13px;}
.roster-file-drop small{color:var(--ink-soft);font-size:10px;}
.roster-file-icon{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;color:var(--primary-text);background:var(--primary);font-size:10px;font-weight:900;letter-spacing:.08em;transform:skew(-5deg);}
.roster-import-instructions{margin-top:16px;padding:15px 17px;border-left:5px solid var(--secondary);background:#f7f9fc;color:var(--ink-soft);font-size:11px;line-height:1.6;}
.roster-import-instructions strong{color:var(--ink);text-transform:uppercase;letter-spacing:.06em;}
.roster-import-instructions ul{margin:7px 0 0 18px;}

@media (max-width:700px){
    .player-page-actions,
    .roster-import-actions{
        align-items:stretch;
        flex-direction:column;
    }
}

.leaderboard-card:hover{

    transform:translateY(-4px);

    box-shadow:0 12px 24px rgba(0,0,0,.15);

}

.rank-badge{

    width:60px;

    height:60px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:bold;

    color:white;

}

.gold{

    background:linear-gradient(135deg,#FFD700,#FDB927);

}

.silver{

    background:linear-gradient(135deg,#C0C0C0,#A8A8A8);

}

.bronze{

    background:linear-gradient(135deg,#CD7F32,#B87333);

}

.default-rank{

    background:#1F2937;

}

.points-total{

    font-size:40px;

    font-weight:800;

    color:var(--secondary);

}

.points-label{

    color:#666;

    font-size:14px;

}
/* ==========================================================
   CoachIQ Design System v2
   Button Components
========================================================== */

.btn-v2{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    padding:12px 20px;

    border:none;
    border-radius:var(--radius);

    cursor:pointer;

    font-size:14px;
    font-weight:600;

    text-decoration:none;

    transition:var(--transition);

    user-select:none;
}

.btn-v2:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow);
}

.btn-v2:active{
    transform:translateY(0);
}

.btn-primary-v2{
    background:var(--primary);
    color:var(--primary-text);
}

.btn-primary-v2:hover{
    background:var(--primary-dark);
}

.btn-secondary-v2{
    background:white;
    color:var(--text);
    border:1px solid var(--border);
}

.btn-secondary-v2:hover{
    background:#F9FAFB;
}

.btn-success-v2{
    background:var(--success);
    color:white;
}

.btn-danger-v2{
    background:var(--danger);
    color:white;
}

.btn-sm-v2{
    padding:8px 14px;
    font-size:13px;
}

.btn-lg-v2{
    padding:14px 28px;
    font-size:16px;
}
/* ==========================================================
   CoachIQ Design System v2
   Form Controls
========================================================== */

.input-v2,
.select-v2,
.textarea-v2{

    width:100%;

    padding:12px 16px;

    border:1px solid var(--border);

    border-radius:var(--radius);

    background:white;

    color:var(--text);

    font-size:14px;

    transition:var(--transition);

    outline:none;

}

.input-v2:focus,
.select-v2:focus,
.textarea-v2:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 4px rgba(31,78,140,.12);

}

.select-v2{

    cursor:pointer;

}
/* ==========================================================
   Page Header
========================================================== */

.page-header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:24px;

}

.page-subtitle{

    margin-top:6px;

    color:var(--muted);

    font-size:15px;

}
/* ===========================================
   Evaluation Table Scrolling
=========================================== */

.evaluation-table-wrapper{

    overflow:auto;
    max-height:65vh;

    border:1px solid var(--border);
    border-radius:var(--radius);

}

/* Keep header visible */

.evaluation-table-wrapper thead th{

    position:sticky;
    top:0;

    background:#F3F4F6;

    z-index:20;

}

/* Freeze Attendance column */

.evaluation-table-wrapper th:nth-child(1),
.evaluation-table-wrapper td:nth-child(1){

    position:sticky;
    left:0;

    background:white;

    z-index:15;

    width:70px;

}

/* Freeze Player column */

.evaluation-table-wrapper th:nth-child(2),
.evaluation-table-wrapper td:nth-child(2){

    position:sticky;

    left:70px;

    background:white;

    z-index:15;

    min-width:220px;

}

/* Header must stay above frozen columns */

.evaluation-table-wrapper thead th:nth-child(1),
.evaluation-table-wrapper thead th:nth-child(2){

    z-index:30;

}
.sticky-attendance{
    position: sticky;
    left: 0;
    background: white;
    z-index: 15;
}

.sticky-player{
    position: sticky;
    left: 70px;
    background: white;
    z-index: 15;
    min-width: 220px;
}

thead .sticky-attendance,
thead .sticky-player{
    z-index: 30;
    background: #F3F4F6;
}

/* ==========================================================
   CoachIQ Premium Interface Layer
   ========================================================== */

:root{
    --app-canvas:#f4f7fb;
    --app-canvas-deep:#edf2f8;
    --ink:#172033;
    --ink-soft:#526078;
    --line:rgba(30,41,59,.10);
    --glass:rgba(255,255,255,.84);
    --premium-shadow:0 16px 40px rgba(15,23,42,.08);
    --premium-shadow-hover:0 22px 52px rgba(15,23,42,.13);
}

html,body{height:100%;}

body{
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    letter-spacing:-.01em;
    background:
      radial-gradient(circle at 78% -10%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 34%),
      linear-gradient(145deg,var(--app-canvas),var(--app-canvas-deep));
}

#app{
    min-height:100vh;
    background:transparent;
}

#sidebar{
    position:relative;
    display:flex;
    flex-direction:column;
    width:258px;
    min-width:258px;
    padding:26px 20px 22px;
    overflow-x:hidden;
    overflow-y:auto;
    background:
      radial-gradient(circle at 30% 0%,rgba(255,255,255,.16),transparent 28%),
      linear-gradient(180deg,var(--primary),var(--primary-dark));
    box-shadow:14px 0 40px rgba(15,23,42,.12);
}

#sidebar::after{
    content:"";
    position:absolute;
    right:-90px;
    bottom:80px;
    width:210px;
    height:210px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:50%;
    box-shadow:0 0 0 38px rgba(255,255,255,.025),0 0 0 76px rgba(255,255,255,.02);
    pointer-events:none;
}

.logo{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:66px;
    margin:0 0 30px;
    padding:9px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:17px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
}

.brand-mark-wrap{
    display:grid;
    place-items:center;
    width:48px;
    height:48px;
    flex:0 0 48px;
    overflow:hidden;
    border-radius:13px;
    background:rgba(255,255,255,.94);
    box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.brand-fallback{
    color:var(--primary);
    font-size:12px;
    font-weight:900;
    letter-spacing:.08em;
}

.program-logo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    margin:0;
    border-radius:0;
    background:#fff;
}

.program-logo:not([hidden]) + .brand-fallback{display:none;}
.brand-copy{min-width:0;}
.logo h2{font-size:16px;line-height:1.15;white-space:normal;}
.logo p{margin-top:4px;font-size:10px;letter-spacing:.04em;}

.nav-label{
    position:relative;
    z-index:1;
    margin:0 12px 10px;
    color:color-mix(in srgb,var(--primary-text) 58%,transparent);
    font-size:10px;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
}

.nav-item{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:11px;
    min-height:45px;
    margin:3px 0;
    padding:10px 12px;
    border:1px solid transparent;
    border-radius:12px;
    color:color-mix(in srgb,var(--primary-text) 84%,transparent);
    font-size:13px;
    font-weight:650;
}

.nav-icon{
    display:grid;
    place-items:center;
    width:27px;
    height:27px;
    flex:0 0 27px;
    border-radius:8px;
    background:rgba(255,255,255,.09);
    font-size:15px;
}

.nav-item:hover{
    color:var(--primary-text);
    border-color:rgba(255,255,255,.12);
    background:rgba(255,255,255,.10);
    transform:translateX(3px);
}

.nav-item.active{
    color:var(--primary);
    border-color:rgba(255,255,255,.65);
    background:#fff;
    box-shadow:0 12px 26px rgba(0,0,0,.17);
}

.nav-item.active .nav-icon{
    color:var(--primary-text);
    background:var(--primary);
}

.sidebar-footer{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:auto;
    padding:14px 10px 4px;
    border-top:1px solid rgba(255,255,255,.12);
    color:var(--primary-text);
}

.sidebar-footer-mark{
    display:grid;
    place-items:center;
    width:30px;
    height:30px;
    border-radius:9px;
    color:var(--primary);
    background:#fff;
    font-weight:900;
}

.sidebar-footer div{display:flex;flex-direction:column;font-size:11px;}
.sidebar-footer small{margin-top:2px;opacity:.6;font-size:9px;letter-spacing:.08em;text-transform:uppercase;}

#content{
    min-width:0;
    padding:0 34px 42px;
    background:transparent;
}

#header{
    position:sticky;
    top:0;
    z-index:45;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:112px;
    margin:0 -34px 30px;
    padding:23px 36px 20px;
    border-bottom:1px solid rgba(30,41,59,.07);
    background:rgba(244,247,251,.82);
    backdrop-filter:blur(18px);
}

.header-eyebrow{
    display:block;
    margin-bottom:5px;
    color:var(--primary);
    font-size:10px;
    font-weight:850;
    letter-spacing:.15em;
    text-transform:uppercase;
}

#header h1{font-size:29px;line-height:1.1;letter-spacing:-.035em;}
#header p{margin-top:6px;color:var(--ink-soft);font-size:13px;}

.header-context{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 13px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--ink-soft);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(15,23,42,.05);
    font-size:11px;
    font-weight:750;
}

.header-status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(22,163,74,.12);}

#page-content{animation:premiumPageIn .25s ease both;}
@keyframes premiumPageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.page-header,
.page-header-block{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
}

.page-header-block{display:block;}
.page-header h2,.page-header-block h2,section>h2{font-size:25px;letter-spacing:-.025em;}
.page-subtitle{margin-top:6px!important;color:var(--ink-soft)!important;font-size:13px;}
.page-kicker{display:block;margin-bottom:6px;color:var(--primary);font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;}

.card{
    border:1px solid rgba(30,41,59,.08);
    border-radius:17px;
    background:var(--glass);
    box-shadow:0 8px 26px rgba(15,23,42,.055);
    backdrop-filter:blur(10px);
}

.card:hover{border-color:rgba(30,41,59,.13);}
.card h3{color:var(--ink);font-size:14px;letter-spacing:-.01em;}

.dashboard-focus-card{
    position:relative;
    overflow:hidden;
    margin-top:22px;
    margin-bottom:24px;
    padding:27px 30px;
    color:var(--primary-text);
    border:0;
    background:linear-gradient(125deg,var(--primary),var(--primary-dark));
    box-shadow:0 20px 44px color-mix(in srgb,var(--primary) 24%,transparent);
}

.dashboard-focus-card::after{
    content:"";
    position:absolute;
    top:-80px;
    right:-30px;
    width:250px;
    height:250px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);
}

.dashboard-focus-label{position:relative;z-index:1;opacity:.72;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
.dashboard-focus-value{position:relative;z-index:1;max-width:780px;margin-top:10px;font-size:23px;font-weight:760;line-height:1.35;letter-spacing:-.025em;}

.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px;}
.dashboard-card{position:relative;min-height:155px;padding:21px;overflow:hidden;}
.dashboard-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--primary),var(--secondary));opacity:.8;}
.dashboard-card h3{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:12px;font-weight:720;}
.metric-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--primary-text);background:var(--primary);font-size:8px;font-weight:900;letter-spacing:.04em;box-shadow:0 6px 12px color-mix(in srgb,var(--primary) 20%,transparent);}
.dashboard-number{margin-top:18px;font-size:35px;font-weight:820;letter-spacing:-.05em;color:var(--ink);}
.dashboard-latest-session{margin-top:18px;font-size:19px;font-weight:760;color:var(--ink);}
.dashboard-label{font-size:11px;color:#7b879b;}
.dashboard-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;}
.dashboard-detail-card{min-height:155px;padding:22px;}
.dashboard-detail-card h3{margin-bottom:16px;}

.btn,.btn-v2,.action-btn,.profile-pdf-btn{
    transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}

.btn,.btn-v2{
    min-height:40px;
    padding:10px 16px;
    border-radius:10px;
    font-size:12px;
    font-weight:760;
    letter-spacing:-.005em;
}

.btn-primary,.btn-primary-v2{
    border:1px solid color-mix(in srgb,var(--primary) 82%,#000);
    box-shadow:0 7px 16px color-mix(in srgb,var(--primary) 20%,transparent);
}

.btn-primary:hover,.btn-primary-v2:hover{transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in srgb,var(--primary) 26%,transparent);}
.btn-danger{box-shadow:0 7px 15px rgba(220,38,38,.14);}
.action-btn{border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 3px 9px rgba(15,23,42,.06);}
.action-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 35%,var(--line));box-shadow:0 7px 15px rgba(15,23,42,.10);}

input,select,textarea,.input{
    color:var(--ink);
    border:1px solid rgba(30,41,59,.13)!important;
    border-radius:10px!important;
    background:rgba(255,255,255,.92)!important;
    box-shadow:0 2px 4px rgba(15,23,42,.025);
    outline:none;
    transition:border-color .16s ease,box-shadow .16s ease;
}

input:focus,select:focus,textarea:focus,.input:focus{
    border-color:color-mix(in srgb,var(--primary) 66%,#fff)!important;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent);
}

label{color:var(--ink-soft);font-size:12px;font-weight:680;}
.search-bar input{min-height:44px;padding:11px 15px;}
.filter-bar{display:flex;gap:10px;margin:12px 0 20px;}
.filter-bar select{min-width:125px;min-height:40px;padding:8px 12px;}

table{border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 7px 22px rgba(15,23,42,.045);}
thead,th{background:#f5f7fa;}
th{padding:13px 15px;color:#647086;border-bottom:1px solid var(--line);font-size:10px;font-weight:820;letter-spacing:.055em;text-transform:uppercase;}
td{padding:13px 15px;color:#263248;border-bottom:1px solid rgba(30,41,59,.065);font-size:12px;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover td{background:#fafcff;}

.session-card,.leaderboard-card{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.90);box-shadow:0 8px 22px rgba(15,23,42,.06);}
.sessions-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
@media(max-width:600px){.sessions-toolbar{align-items:stretch;flex-direction:column}.sessions-toolbar .btn{width:100%}}
.session-card:hover,.leaderboard-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 22%,var(--line));box-shadow:var(--premium-shadow-hover);}
.leaderboard-card{padding:19px 21px;}
.rank-badge{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 7px 16px rgba(15,23,42,.12);}

/* Leaderboard refresh */
.leaderboard-page{display:grid;gap:20px}.leaderboard-page-header{margin:0}.leaderboard-page-header h2{font-size:30px}.leaderboard-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:150px;padding:26px 30px;overflow:hidden;border-left:7px solid var(--secondary);color:var(--primary-text);background:linear-gradient(115deg,var(--primary),var(--primary-dark));box-shadow:0 18px 40px color-mix(in srgb,var(--primary) 20%,transparent)}

.getting-started-page{max-width:1120px;margin:0 auto;}
